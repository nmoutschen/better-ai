<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture design</title>
  <link rel="stylesheet" href="/page.css">
  <link rel="stylesheet" href="/architect.css">
  <script src="/page.js" defer></script>
  <script src="/architect.js" defer></script>
</head>
<body>
  <div class="band"></div>
  <header class="bar--stats">
    <div><h1 id="title">Architecture design</h1></div>
    <div class="stats">
      <span class="stat"><b id="accepted-count"></b>sections accepted</span>
      <span class="stat"><b id="comment-count">0</b>open comments</span>
      <button type="button" class="stat" id="questions"><b id="question-count">0</b>open questions</button>
    </div>
  </header>
  <p class="offline" role="status" hidden>The design page is closed. Ask the architect to restart it.</p>
  <section class="errors" id="errors" aria-labelledby="errors-h" hidden></section>
  <div class="work">
    <main class="view">
      <div class="tabs" role="tablist" aria-label="Design sections">
        <button type="button" role="tab" id="tab-overview" aria-selected="true" aria-controls="panel-overview">Overview</button>
        <button type="button" role="tab" id="tab-requirements" aria-selected="false" aria-controls="panel-requirements" tabindex="-1">Requirements</button>
        <button type="button" role="tab" id="tab-containers" aria-selected="false" aria-controls="panel-containers" tabindex="-1">Containers</button>
        <button type="button" role="tab" id="tab-flows" aria-selected="false" aria-controls="panel-flows" tabindex="-1">Flows</button>
        <button type="button" role="tab" id="tab-perspectives" aria-selected="false" aria-controls="panel-perspectives" tabindex="-1">Perspectives</button>
        <button type="button" role="tab" id="tab-decisions" aria-selected="false" aria-controls="panel-decisions" tabindex="-1">Decision records</button>
        <button type="button" role="tab" id="tab-spec" aria-selected="false" aria-controls="panel-spec" tabindex="-1">Spec</button>
      </div>
      <section id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
      <section id="panel-requirements" role="tabpanel" aria-labelledby="tab-requirements" hidden></section>
      <section id="panel-containers" role="tabpanel" aria-labelledby="tab-containers" hidden></section>
      <section id="panel-flows" role="tabpanel" aria-labelledby="tab-flows" hidden></section>
      <section id="panel-perspectives" role="tabpanel" aria-labelledby="tab-perspectives" hidden></section>
      <section id="panel-decisions" role="tabpanel" aria-labelledby="tab-decisions" hidden></section>
      <section id="panel-spec" role="tabpanel" aria-labelledby="tab-spec" hidden></section>
    </main>
    <aside class="notes" aria-labelledby="notes-h">
      <div class="notes-top">
        <h2 id="notes-h">Conversation</h2>
        <div class="seg seg--light" role="group" aria-label="Show">
          <button type="button" data-filter="all" aria-pressed="false">All</button>
          <button type="button" data-filter="open" aria-pressed="true">Open</button>
        </div>
      </div>
      <p class="empty">Click a box, arrow or step to comment on it, or write to the architect below.</p>
      <ol class="thread"></ol>
      <div class="composer">
        <div class="decide" id="review-menu" hidden>
          <p class="menu-h"></p>
          <p class="review-summary"></p>
          <button type="button" class="btn" id="run-review"></button>
        </div>
        <p class="unwatched" role="status" hidden>The architect is away. Your messages are saved for when they return.</p>
        <label for="note">Message to the architect</label>
        <textarea id="note"></textarea>
        <div class="send">
          <button type="button" class="btn">Send</button>
          <button type="button" class="btn btn--quiet" id="review-toggle" aria-expanded="false" aria-controls="review-menu">Approve…</button>
          <p class="status" role="status"></p>
        </div>
      </div>
    </aside>
  </div>
  <div class="pop" role="dialog" aria-label="Comment on diagram" hidden>
    <p class="target"></p>
    <textarea aria-label="Comment"></textarea>
    <div class="comment-actions">
      <button type="button" class="btn ok">Send</button>
      <button type="button" class="btn btn--quiet cancel">Cancel</button>
      <button type="button" class="btn btn--quiet remove" hidden>Delete</button>
    </div>
  </div>
  <div class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
