    \ writer = csv.writer(out, lineterminator=\"\\n\")\n    writer.writerow([\"name\", \"email\"])\n    for member in members:\n\
    \        writer.writerow([member[\"name\"].strip(), member[\"email\"]])\n    return out.getvalue()\n"
