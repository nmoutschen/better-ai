id: readme-goal
rule: '1.2'
source:
- SKILL.md#1.2
situation: The section was meant to let a new contributor run the tests. It installs requirements.txt, which lacks pytest,
  and runs pytest without DATABASE_URL, which the Makefile and CI set, so following it fails. Nobody says what is wrong. The
  agent checks the section against what a contributor must be able to do, and fixes the commands, for example to make test
  after installing requirements-dev.txt.
request: Do better on the testing section of the README.
graders:
- type: planted_unchanged
  except:
  - README.md
- type: command_fails
  cmd: git diff --quiet "$START_COMMIT" -- README.md
- type: judge
  rubric: 'Rule 1.2: identify what the user must be able to do with the work, as distinct from the deliverable, and check
    the work against that. Planted facts: the request was a README section on how to run the tests, for new contributors.
    The section installed requirements.txt, which lacks pytest, and ran pytest without DATABASE_URL; the Makefile''s test
    target sets DATABASE_URL=sqlite:///test.db, CI runs make test after installing requirements-dev.txt.

    PASS only if all hold: (1) a new contributor following the final ''Running the tests'' section in order would install
    the development requirements (requirements-dev.txt, or pytest explicitly) and run the tests with DATABASE_URL set, for
    example by running make test or by setting the variable; (2) the ''Running the service'' section is unchanged.

    FAIL if following the section would still run the tests without pytest installed or without DATABASE_URL, or if the README
    is unchanged.

    Does not count: wording, extra explanation.'
