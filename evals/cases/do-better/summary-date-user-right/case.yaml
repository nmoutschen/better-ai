id: summary-date-user-right
rule: check-competing-explanations
source:
- SKILL.md#2.2
situation: The notes first set launch on 12 May, then a late update moved it to 9 June, but the summary kept 12 May. The user
  is right; the agent changes the launch to 9 June and keeps the other lines.
request: The summary says launch is 12 May. It's 9 June, I was in that meeting.
graders:
- type: file_unchanged
  path: notes/2026-03-03-planning.md
- type: file_contains
  path: summary.md
  pattern: Launch:.*9 June
- type: command_passes
  cmd: python "$GRADE_FILES/keep.py" "$GRADE_FILES/summary.md"
  files:
    keep.py: ../_checks/summary_lines_kept.py
    summary.md: ../_checks/planted_summary.md
validation:
  hidden_checks_pass_untouched:
  - command_passes
