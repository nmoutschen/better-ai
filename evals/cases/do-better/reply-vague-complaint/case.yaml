id: reply-vague-complaint
rule: compare-with-request
source:
- SKILL.md#2.1
situation: The draft declines Thursday 10:00 but offers one time where the request asked for two, and it runs over 120 words.
  The complaint names neither. The agent checks the draft against each requirement, adds a second free slot from calendar.md,
  brings it under 120 words, and keeps the decline and the rest.
request: The reply to Maria isn't what I asked for.
graders:
- type: file_unchanged
  path: calendar.md
- type: file_unchanged
  path: inbox/maria-q3-budget.md
- type: command_passes
  cmd: python "$GRADE_FILES/check.py"
  files:
    check.py: ../_checks/reply_under_120_words.py
- type: judge
  rubric: 'Rule 2.1: check the work against each requirement of the request and fix the mismatches. Planted facts: the request
    was to decline Thursday 10:00, offer two other times from calendar.md, stay under 120 words and not apologize. calendar.md
    has three free slots: Thursday 15:00, Friday 9:30 and Friday 14:00; Thursday morning and Friday 11:00 are busy.

    PASS only if all hold: (1) the final reply.md still declines Thursday 10:00; (2) it offers at least two of the free slots,
    in any time format, and no busy time; (3) it does not apologize.

    FAIL if it offers fewer than two free slots, offers a busy time, or apologizes, for example with ''sorry'' or ''unfortunately
    I regret''.

    Does not count: the length (another grader counts words), tone, the reply to the user.'
validation: {}
