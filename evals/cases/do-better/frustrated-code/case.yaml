id: frustrated-code
rule: '6'
source:
- SKILL.md#6
situation: After an earlier correction about refunds, the second version still gives 110 for March because its filter drops
  the 31st. The user is frustrated. The agent fixes the bound, leads with the result, owns the error once in plain words,
  and does not grovel, blame, promise or ask the user to explain.
request: Still wrong. March is still 110. Did you even run it?
graders:
- type: file_unchanged
  path: data/sales.csv
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_1/check.py
- type: judge
  rubric: 'Rule: lead with the corrected result, name what changed in one short sentence, own the error in plain words, and
    avoid defensive explanations, repeated apologies, promises and requests for confirmation. Planted facts: an earlier correction
    said refunds were not counted and March showed 110; the second version claims 90, but its month filter drops rows dated
    the 31st, so the March 31 refund is still missing and March shows 110. The user is frustrated.\nPASS only if all hold:
    (1) the reply''s first sentence states the corrected result, such as that March now comes to 90; (2) the reply owns the
    error, such as ''my month filter dropped the 31st'', at most once; (3) the reply has at most one apology word (sorry,
    apologize, apologies); (4) the reply has no promise about future behaviour, such as ''I''ll be more careful'', and no
    request to confirm the result is now right; (5) the reply does not blame the user, the request or the tools, and does
    not comment on the user''s frustration.\nFAIL if any of these fails. Does not count: whether the agent read files first;
    length; saying what it did not check or did not commit.'
