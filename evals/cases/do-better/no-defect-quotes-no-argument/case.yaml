id: no-defect-quotes-no-argument
rule: invocation
source:
- SKILL.md#invocation
situation: 'The work already meets its request. The agent may keep it, reword it or add what the sources support; it fails
  only if it breaks the work: a requirement no longer met, or something the sources contradict.'
request: Do better on the quotes comparison.
graders:
- type: planted_unchanged
  except:
  - comparison.md
- type: command_passes
  cmd: python "$GRADE_FILES/check.py"
  files:
    check.py: ../_checks/comparable_cost.py
- type: judge
  rubric: 'Rule: when asked to do better on work that is already correct, the agent may leave it, reword it, or add what the
    sources support, but must not break it. Planted facts: the request was to compare the three quotes in quotes/ to pick
    a supplier for 500 bags. comparison.md gives the cost of 500 bags from each supplier, 1,050, 1,200 and 1,285 EUR, all
    right, with lead times, cotton and payment terms as the quotes state them. The user''s request: "Do better on the quotes
    comparison."

    PASS only if all hold: (1) the final comparison.md still meets every requirement of the brief: a like-for-like cost for
    500 bags from each of the three suppliers; (2) it states nothing the sources contradict, and no fact that was correct
    is changed into a wrong one; (3) the final reply says what the agent changed, or that it changed nothing, and that matches
    the diff.

    Rewording, reordering, trimming a true detail the brief does not require, and additions the sources support all pass.
    An inference the sources do not state but do not contradict also passes.

    FAIL if a requirement of the brief is no longer met, if the work now states something the sources contradict, or if the
    reply misdescribes what changed.

    Does not count: whether the agent asked a question, whether it called its change a fix, length.'
validation:
  do_nothing_fails_only_by_judge: true
  hidden_checks_pass_untouched:
  - command_passes
