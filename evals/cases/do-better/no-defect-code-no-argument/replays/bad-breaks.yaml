  content: "\"\"\"Monthly sales totals from the shop's CSV export.\"\"\"\n\nimport csv\n\n\ndef load(path):\n    \"\"\"Read\
    \ the export's rows as dicts with date, amount and note.\"\"\"\n    with open(path, newline=\"\") as handle:\n       \
    \ return list(csv.DictReader(handle))\n\n\ndef monthly_total(rows, year, month):\n    \"\"\"Total of one month's rows.\
    \ Refunds are negative amounts, so they reduce the total.\"\"\"\n    start = f\"{year}-{month:02d}-01\"\n    end = f\"\
    {year}-{month:02d}-31\"\n    return sum(int(row[\"amount\"]) for row in rows if start <= row[\"date\"] < end)\n\n\nif\
    \ __name__ == \"__main__\":\n    import sys\n\n    print(monthly_total(load(\"data/sales.csv\"), int(sys.argv[1]), int(sys.argv[2])))\n"
