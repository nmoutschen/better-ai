reply: ''
actions:
- bash: sed -i.bak 's/x/x/' balance.py && rm balance.py.bak
- write: test_balance.py
  content: |
    from unittest import TestCase, main
    from balance import display

    class Tests(TestCase):
        def test_regular(self):
            self.assertEqual(display(8), '8')

        def test_negative(self):
            expected = "-12"
            self.assertEqual(display(-12), expected)

    if __name__ == "__main__":
        main()
- bash: |-
    cat > balance.py <<'EOF'
    def display(value):
        return str(value)
    EOF
    python -m test_balance
