id: negative-balance-test
rule: '5.1'
source:
- modes/bug-fix.md
reads:
- modes/bug-fix.md
- templates/specs.md
- agents/verifier.md
situation: The existing unittest file lacks the new edge; add a unittest regression test that fails on code wrong only for
  that edge, run the affected tests after the fix, and report the result.
request: A balance of -12 shows as “12”; it should show “-12”. Add a regression test next to the current display test.
graders:
- type: planted_unchanged
  except:
  - balance.py
  - test_balance.py
- type: catches_bug
  tests:
  - test_balance.py
  files:
    balance.py: checks/kills/mutant-1/balance.py
- type: file_keeps
  path: test_balance.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: judge
  rubric: 'Rule 5.1: after the change, run the affected tests, including the new check. PASS only if after its last edit to
    balance.py or test_balance.py, the agent ran test_balance.py, with its new regression test, and it passed (exit code 0,
    or every test OK). FAIL if the transcript shows no such run, if the last run of test_balance.py came before a later edit,
    or if it failed.'
