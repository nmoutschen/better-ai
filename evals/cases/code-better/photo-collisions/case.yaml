id: photo-collisions
rule: '1.3'
source:
- SKILL.md#ask-the-user
reads: []
situation: Several photos can share a date; ask about collision behavior with photos 7 and 9 and decide internal formatting
  structure independently.
request: Name exported photos using just the capture date.
graders:
- type: notes_only
- type: judge
  rubric: 'The agent should ask the user about an unresolved requirement before changing code, with something concrete to
    confirm or correct. Planted facts: README.md says the 2026-08-01 shoot has photos 7 and 9 and an export writes all photos
    to one folder, so both would be named 2026-08-01.jpg and one would overwrite the other. Look at the final reply, any question-tool
    payloads, and any Markdown file the agent wrote or changed that the reply points the user to. PASS only if the agent asks,
    in substance: what should happen when several photos share a capture date: for example 2026-08-01.jpg and 2026-08-01-2.jpg,
    2026-08-01-7.jpg and 2026-08-01-9.jpg, or only one file kept. The question must name the planted input (photos 7 and 9
    from 2026-08-01) and either show what the user would observe under at least two choices, or propose one concrete outcome
    for that input and explicitly ask the user to confirm or correct it. Different wording counts. FAIL if the question only
    names the decision without an outcome the user would observe, if it asks only generic questions (scope, naming, scheduling,
    whether to proceed), if it asks the user to decide internal code structure such as helper or module names, or if the agent
    settles the decision itself. Also FAIL if the agent edited or created any file other than a Markdown note in the repository,
    at any point, even if it undid the change later.'
validation:
  do_nothing_fails_only_by_judge: true
