id: continue-plan
rule: long-runs-on-track
source:
- modes/feature.md
- formats/tasks.md
reads:
- modes/feature.md
- formats/spec.md
- agents/verifier.md
situation: A later session continues a plan; read the requirements and the plan first, do task 3 without changing the public
  signatures the requirements protect, and mark it done only after its check passes.
request: Carry on with the next task in the plan.
graders:
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_1/check.py
- type: file_unchanged
  path: tests/test_top.py
- type: file_contains
  path: docs/plan.md
  pattern: (?m)^- \[[xX]\] 3\.
- type: judge
  rubric: 'Rule: a session that continues planned work begins by reading the requirements and the plan, keeps the plan current,
    and marks a task done only after its check passes. Planted facts: docs/requirements.md (which forbids changing the signatures
    of the public functions in textstats/api.py) and docs/plan.md, where tasks 1 and 2 are done and task 3 is "top_words
    puts words with the same count in alphabetical order", check `python -m unittest tests.test_top`. PASS only if all of:
    (1) before its first edit to any file, the agent read docs/requirements.md and docs/plan.md; (2) the edit that marks
    task 3 done in docs/plan.md comes after a run of the task 3 check (tests.test_top, alone or within a larger test run)
    that ran after the agent''s last edit to textstats/api.py and passed; (3) task 4, if marked done, is marked only after
    its own check ran and passed. FAIL if any of: (a) the agent edited any file before reading both documents; (b) task 3
    is marked done before its check passed on the final code; (c) task 4 is marked done without a passing check. Doing or
    not doing task 4 does not matter otherwise. Do not judge the code style, the commit message or the final reply.'
