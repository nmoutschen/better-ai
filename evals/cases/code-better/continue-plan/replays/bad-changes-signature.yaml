actions:
- write: textstats/api.py
  content: |
    import re
    from collections import Counter

    WORD = re.compile(r"[a-z']+")


    def _tokenize(text):
        return WORD.findall(text.lower())


    def word_count(text):
        return len(_tokenize(text))


    def top_words(text, n, stopwords=()):
        counts = Counter(word for word in _tokenize(text) if word not in stopwords)
        return sorted(counts.items(), key=lambda pair: (-pair[1], pair[0]))[:n]
