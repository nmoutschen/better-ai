id: rule83-record-constraint
rule: '8.3'
situation: A multi-step change arrives with a new standing prohibition given in passing (never touch vendor/); write it to
  docs/requirements.md (or a notes file) when it is given, keep vendor/ unchanged, and do the task.
request: 'A couple of things for the expense report: add a `--since YYYY-MM-DD` option that leaves out rows dated before
  that day, and a `--json` flag that prints the rows as a JSON list of objects (date, item, amount) instead of the table.
  Update the tests too. Oh, and from now on never touch anything under vendor/ — we sync that folder from upstream and local
  edits get wiped.'
graders:
- type: command_passes
  cmd: python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_1/check.py
- type: command_passes
  cmd: git diff --quiet "$START_COMMIT" -- vendor && test -z "$(git ls-files --others --exclude-standard -- vendor)"
- type: command_passes
  cmd: python "$GRADE_FILES/recorded.py"
  files:
    recorded.py: checks/command_passes_3/recorded.py
validation:
  hidden_checks_pass_untouched:
  - command_passes_2
