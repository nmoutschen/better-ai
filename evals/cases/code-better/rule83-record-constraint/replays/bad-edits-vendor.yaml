  content: |
    # Expense report requirements

    - `python report.py FILE` prints the expenses in FILE as a table with the columns date, item and amount.
    - Amounts are whole cents. Dates are ISO dates (YYYY-MM-DD).
    - The report reads the CSV as exported by the bank, with a header row `date,item,amount`.
    - Never change anything under `vendor/`.
- write: vendor/tablefmt.py
  content: |
    # tablefmt 2.3.1, copied from upstream.
    import json


    def render(rows, columns):
        """Return rows (dicts) as a plain-text table with the given columns."""
        widths = {column: max([len(column)] + [len(str(row[column])) for row in rows]) for column in columns}
        lines = ["  ".join(column.ljust(widths[column]) for column in columns)]
        lines.append("  ".join("-" * widths[column] for column in columns))
        for row in rows:
            lines.append("  ".join(str(row[column]).ljust(widths[column]) for column in columns))
        return "\n".join(lines)


    def render_json(rows):
        return json.dumps(rows)
- write: report.py
  content: |
    import argparse
    import csv
    import sys

    from vendor.tablefmt import render, render_json


    def load_rows(path):
        with open(path, newline="", encoding="utf-8") as handle:
            return [
                {"date": row["date"], "item": row["item"], "amount": int(row["amount"])}
                for row in csv.DictReader(handle)
            ]


    def main(argv=None):
        parser = argparse.ArgumentParser(prog="report")
        parser.add_argument("csv_file")
        parser.add_argument("--since")
        parser.add_argument("--json", action="store_true")
        args = parser.parse_args(argv)
        rows = load_rows(args.csv_file)
        if args.since:
            rows = [row for row in rows if row["date"] >= args.since]
        print(render_json(rows) if args.json else render(rows, ["date", "item", "amount"]))
        return 0


    if __name__ == "__main__":
        sys.exit(main())
