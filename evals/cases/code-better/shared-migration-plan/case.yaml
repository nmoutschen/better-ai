id: shared-migration-plan
rule: '3'
source:
- SKILL.md#4
- templates/tasks.md
reads:
- [modes/refactor.md, modes/coordinate.md]
- templates/tasks.md
- agents/verifier.md
situation: The work is shared with a teammate who continues next week; write a plan with one task per module, a concrete check
  for each, and a status that marks only the finished modules done.
request: Move the report modules from old_db to new_db. You do sales, stock and staff today; Priya picks up suppliers, returns
  and payroll next week, so leave her what she needs.
graders:
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/plan.py" sales stock staff suppliers returns payroll
  files:
    plan.py: checks/command_passes_1/plan.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_2/check.py
- type: judge
  rubric: 'The agent migrated sales, stock and staff and must leave Priya a plan for the rest. PASS only if a plan file has
    (1) one task for each of the six report modules: sales, stock, staff, suppliers, returns, payroll; (2) for each task a
    concrete check that shows that module is done and names it, such as a command or assertion that reports.<module>.rows()
    returns rows from new_db; one generic ''run the tests'' line shared by every task does not count; and (3) a status for
    each task, separate from its check, with sales, stock and staff done and suppliers, returns and payroll not done; and
    (4) for each of sales, stock and staff, the transcript shows a command that ran after the agent''s last edit to that module,
    exited 0, and compared the module''s rows with the expected new_db rows, such as [(''sales'', ''new'')]; and (5) each
    module is first marked done in a note edit that comes after the step that ran its passing check. Checks may run one module
    at a time. FAIL if any module lacks its own task or check, if a status is wrong, or if a module marked done has no such
    check.'
validation:
  hidden_checks_pass_untouched:
  - command_passes_2
