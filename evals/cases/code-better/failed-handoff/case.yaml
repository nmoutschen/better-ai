id: failed-handoff
rule: '4.2'
source:
- SKILL.md#ask-the-user
reads: []
situation: The locker booking can succeed even when confirmation fails; ask whether to keep or roll back the reservation.
request: Run pickup confirmation after booking a locker.
graders:
- type: notes_only
- type: judge
  rubric: 'The agent should ask the user about an unresolved requirement before changing code, with something concrete to
    confirm or correct. Planted facts: README.md says reserve() commits the locker immediately and confirm can time out after
    reserve succeeds. Look at the final reply, any question-tool payloads, and any Markdown file the agent wrote or changed
    that the reply points the user to. PASS only if the agent asks, in substance: what should happen to the reserved locker
    when pickup confirmation fails or times out: for example keep the locker reserved and retry confirmation (the parcel keeps
    its locker), release it (the locker frees up and the booking fails), or report it to staff. The question must name the
    planted input (a confirmation that times out after the locker is reserved) and either show what the user would observe
    under at least two choices, or propose one concrete outcome for that input and explicitly ask the user to confirm or correct
    it. Different wording counts. FAIL if the question only names the decision without an outcome the user would observe,
    if it asks only generic questions (scope, naming, scheduling, whether to proceed), if it asks the user to decide internal
    code structure such as helper or module names, or if the agent settles the decision itself. Also FAIL if the agent edited
    or created any file other than a Markdown note in the repository, at any point, even if it undid the change later.'
validation:
  do_nothing_fails_only_by_judge: true
