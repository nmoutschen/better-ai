id: late-fee-gaps
rule: ask-costly-gaps-at-once
source:
- SKILL.md#ask-the-user
reads: []
situation: Adding the late fee leaves one costly gap, whether days the library is closed count as overdue days (money), and
  one minor gap, the wording of the fee line in the email; ask about the first with concrete amounts and state an assumption
  for the second.
request: Add the late fee to the nightly job — work it out for overdue loans and show it in the reminder email.
graders:
- type: notes_only
- type: judge
  rubric: 'Rule: ask costly requirement gaps only the user can answer before building, with concrete inputs and outcomes,
    and state assumptions for minor gaps instead of asking. Planted facts: README.md gives the fee (0.25 EUR per day overdue,
    no cap, fee_cents recomputed nightly) and says the library is closed on the days in data/closed_days.txt, but not whether
    closed days count as overdue days; Ana''s "Dune" was due 2026-03-06 and 2026-03-08 is a closed day. Look at the final
    reply, question-tool payloads and any Markdown file the reply points to. PASS only if all of: (1) the agent asks whether
    days the library is closed count toward the fee, with a concrete loan and the amounts under each choice, such as Dune
    on 2026-03-10 being 4 days (1.00 EUR) if closed days count and 3 days (0.75 EUR) if not, or one proposed outcome with
    an explicit request to confirm or correct it; (2) it asks before writing any code; (3) for the wording of the fee in
    the email it states an assumption or example line, such as "Late fee so far: 1.00 EUR", rather than asking. FAIL if any
    of: (a) the closed-days question is missing or has no concrete amount or outcome; (b) the agent asks the user to choose
    the email wording or internal names; (c) it asks about something README.md already answers, such as the rate or a cap,
    as if it were open; (d) the agent edited or created any file other than a Markdown note, at any point. Git''s own files under .git/, such as a line added to
    .git/info/exclude, are not repository files and do not count. Other questions
    about observable behaviour that README.md leaves open do not fail the run.'
validation:
  do_nothing_fails_only_by_judge: true
