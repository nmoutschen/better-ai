# One sentence per source of skills/code-better: the core instruction of that SKILL.md section or skill file
# (rewritten skill, 2026-11-19). Keys are the sources that cases name in `source`. The one-sentence condition
# appends the sentence for a case's first source to its request; cases whose first source has no entry are not
# run in that condition. The short-skill condition installs every sentence as the body of a short SKILL.md.
"SKILL.md#invocation": "You don't have to write code right away: if the request leaves open something only I can decide, ask me first, and if it is clear, just make the change."
"SKILL.md#3.1": "If what you would build contradicts a decision the design already records, or you would make a decision worth recording, such as a new dependency or a schema change, ask me first with the options, your recommendation, and each option's main drawback."
"SKILL.md#3.2": "Before you write checks or code, ask me in one message about every gap I would notice that is costly to get wrong, such as what is stored, charged or shown, or how invalid input or a failure is handled, with concrete inputs and the outcome of each option; decide the other gaps yourself and state them as assumptions."
"SKILL.md#3.3": "If a test contradicts a requirement, two requirements conflict, or a requirement cannot hold as written, tell me the change you propose and what I would see differently, and don't build your own version until I agree."
"SKILL.md#1.1": "If I propose a specific solution, check that it serves what I actually need, and if it works against that, tell me once with one alternative, then follow my decision."
"SKILL.md#1.2": "Before deciding anything, read the code you will touch, its callers and tests, the project's instruction files and any design, and don't ask me what they already answer."
"SKILL.md#1.3": "Keep your working notes in .code/<change>/, and in a session long enough to be summarised, write each constraint I give you to .code/<change>/notes.md when I give it and re-read it after each summary."
"SKILL.md#4": "If the change is more than a small fix with one obvious reading, write its requirements as testable statements with concrete values; write a design only if the change adds structure, and a task list only if the work spans several sessions, people or agents."
"SKILL.md#6": "Follow the codebase's existing patterns, change only what the task needs, list anything else worth changing as a proposed next step, and do the building yourself, using sub-agents only for reading and review."
"SKILL.md#7": "Run the affected tests and one check per requirement that compares the result with its expected value, count a requirement as met only if a check on the final code shows it, and stop and tell me what fails, what you tried and the cause you suspect when the same check fails twice for the same reason."
"SKILL.md#5": "Never edit, skip or delete a check, or special-case its inputs, to make it pass; if a check looks wrong, stop, explain why and ask me."
"SKILL.md#8": "Before you hand back, have a sub-agent that did not build the change review it, for every change however small, and fix what it confirms."
"SKILL.md#9": "When you hand back, tell me what changed, each check with its result, your assumptions and proposed next steps, without presenting passing checks as my approval, and offer a short explanation, asking me a question first if I want to understand the code."
"modes/feature.md": "For new or changed behaviour, write the checks before the code: each fails on the current code for the reason its requirement gives and passes after the change."
"modes/bug-fix.md": "For a bug, first write a check that reproduces it and fails on the current code, fix the cause, and if an existing test asserts the buggy behaviour, ask me instead of changing that test."
"modes/refactor.md": "For a refactor or migration, pin the current behaviour with checks that pass before the change, and run them again after it: any difference is a defect of the change."
"modes/tests.md": "When you add tests, take the expected values from the spec or documented behaviour, not from the code, and tell me where the code disagrees instead of changing it."
"modes/coordinate.md": "Only when the work splits into several tasks that each need their own review, have sub-agents build and review each task on its own branch while you keep the design and the spec."
"agents/verifier.md": "When you review code, look first for wrong behaviour against the requirements, broken callers, security problems, data loss and missing error handling, and confirm each finding with a failing test, a reproduction, or the exact lines and input that cause it."
