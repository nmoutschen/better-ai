# One sentence per source of skills/code-better: the core instruction of that SKILL.md section or skill file
# (full rewrite, 2026-11-19). Keys are the sources that cases name in `source`. The one-sentence condition
# appends the sentence for a case's first source to its request; cases whose first source has no entry are not
# run in that condition. The short-skill condition installs every sentence as the body of a short SKILL.md.
"SKILL.md#invocation": "You don't have to write code right away: if the request leaves open something only I can decide, ask me first, and if it is clear, just make the change."
"SKILL.md#ask-the-user": "Ask me in one message about every gap I would notice that is costly to get wrong, such as what is stored, charged or shown, or how invalid input or a failure is handled, with concrete inputs and each option's outcome; ask me about decisions that change behaviour, cost or risk or contradict the design, with your recommendation and its drawback; tell me about conflicting tests or requirements instead of building your own version; and state every other gap as an assumption."
"SKILL.md#1": "Before deciding anything, read the code you will touch, its callers and tests, the project's instruction files and any design, don't ask me what they already answer, and if I propose a solution that works against what I need, tell me once with one alternative, then follow my decision."
"SKILL.md#working-notes": "Keep your working notes in .code/<change>/, write a task list there when the work spans several sessions, people or agents, and in a session long enough to be summarised, write each constraint I give you to .code/<change>/notes.md and re-read it after each summary."
"SKILL.md#4": "Before you hand back, have a sub-agent that did not build the change review it, for every change however small, wait for its report, and fix what it confirms, at most twice."
"SKILL.md#5": "When you hand back, tell me what changed, each requirement with its check and result, your assumptions and proposed next steps, without presenting passing checks as my approval, and offer a short explanation, asking me a question first if I want to understand the code."
"modes/feature.md": "For new or changed behaviour, write the requirements in .code/<change>/specs.md, then one check per requirement that fails on the current code, then the code, following the codebase's patterns and changing only what the spec needs, then run the affected tests, every check and the project's linters on the final code, never editing a check to make it pass."
"modes/bug-fix.md": "For a bug, write the behaviour to restore in .code/<change>/specs.md, then a check that reproduces it and fails on the current code, fix the cause, run the checks and the project's linters on the final code, and if an existing test asserts the buggy behaviour, ask me instead of changing that test."
"modes/refactor.md": "For a refactor or migration, pin the current behaviour with checks that pass before the change, and run them again after it: any difference is a defect of the change."
"modes/tests.md": "When you add tests, take the expected values from the spec or documented behaviour, not from the code, and tell me where the code disagrees instead of changing it."
"modes/coordinate.md": "Only when the work splits into several tasks that each need their own review, have sub-agents build and review each task on its own branch while you keep the design, the spec and the task list."
"agents/verifier.md": "When you review code, look first for wrong behaviour against the requirements, broken callers, security problems, data loss and missing error handling, and confirm each finding with a failing test, a reproduction, or the exact lines and input that cause it."
"modes/audit.md": "When I ask for an audit, change no code: collect the Git history (how often files change, which change together, bug fixes) and the project's checks, review the code for what costs me now, diverged copies of the same knowledge, hidden failures and hard-to-change code that changes often, rank findings by what they cost me, write every finding with its evidence and a proposed task to .code/audit/findings.md, and in your reply propose only the five to ten most valuable, saying where the full list is."
