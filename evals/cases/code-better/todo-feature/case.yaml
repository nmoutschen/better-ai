id: todo-feature
rule: '4.1'
source:
- SKILL.md#6
reads:
- modes/bug-fix.md
- templates/next-steps.md
- agents/verifier.md
situation: A TODO for discount codes sits next to the bug; fix the total, keep total(lines) as it is, and leave the feature
  unbuilt.
request: The cart total ignores quantities. Please fix.
graders:
- type: planted_unchanged
  except:
  - cart.py
- type: file_contains
  path: cart.py
  pattern: '# TODO: support discount codes at checkout\.'
- type: file_not_contains
  path: cart.py
  pattern: (?i)def \w*discount|discount\w*\s*=
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
