reply: Added a line that strips the euro sign and a test for it.
actions:
- bash: |
    python - <<'EOF'
    path = "bank_import.py"
    source = open(path).read()
    source = source.replace("    cell = cell.strip()\n", "    cell = cell.strip()\n    if cell.startswith(\"€\"):\n        cell = cell[1:]\n")
    open(path, "w").write(source)
    EOF
- write: test_bank_import.py
  content: |
    import unittest
    from decimal import Decimal

    from bank_import import parse_amount


    class ParseAmountTest(unittest.TestCase):
        def test_plain_amount(self):
            self.assertEqual(parse_amount("12.50"), Decimal("12.50"))

        def test_debit(self):
            self.assertEqual(parse_amount("-3.20"), Decimal("-3.20"))

        def test_euro_sign(self):
            self.assertEqual(parse_amount("€-18.40"), Decimal("-18.40"))

        def test_rejects_text(self):
            with self.assertRaises(ValueError):
                parse_amount("n/a")


    if __name__ == "__main__":
        unittest.main()
- bash: python -m unittest test_bank_import
