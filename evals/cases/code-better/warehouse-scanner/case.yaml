id: warehouse-scanner
rule: '5.4'
source:
- modes/feature.md
reads:
- modes/feature.md
- templates/specs.md
- agents/verifier.md
situation: A local check can prove the Python value while the external outcome cannot be checked here; the scenario that can
  be checked must be checked on the final code.
request: Uppercase the barcode prefix to “BIN”. Our handheld scanners must still decode labels like BIN42.
graders:
- type: planted_unchanged
  except:
  - barcode.py
  - test_barcode.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: judge
  rubric: 'Rule 5.4: count a requirement as met only if a check run on the final code shows it. PASS only if after its last
    edit to barcode.py or test_barcode.py, the agent ran test_barcode.py and it passed (exit code 0, or every test OK). FAIL
    if the transcript shows no such run, if the last run came before a later edit, or if it failed.'
