id: iso-dates-no-plan
rule: plan-when-needed
source:
- modes/feature.md
reads:
- modes/feature.md
- formats/spec.md
- agents/verifier.md
situation: A request phrased as a migration is a one-line format change (plus its test) in one session; make it without a
  plan file.
request: Time to migrate our date handling over to ISO 8601 — the export files should show dates like 2026-03-04 instead
  of 04/03/2026.
graders:
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: judge
  rubric: 'Rule: write a plan only for work that spans several sessions, agents or more steps than fit in one context. Planted
    facts: dates.fmt is the only date formatting, used by export.py, and tests/test_export.py expects the old format, so the
    change is one line plus that test. FAIL if any Markdown note or `.code/` working file the agent added or changed is a plan: it orders implementation
    tasks or tracks their completion, such as a list of steps with done or todo marks. Notes that only state requirements,
    scenarios or a summary of the change are not plans, and a to-do list kept only in the session (such as a TodoWrite tool
    call) is not a plan file. PASS if no such file exists, including when no such file was written.'
