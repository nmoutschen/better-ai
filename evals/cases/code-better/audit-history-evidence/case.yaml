id: audit-history-evidence
rule: audit-history-evidence
source:
- modes/audit.md
reads:
- modes/audit.md
situation: 'The price formula is copied in pricing.py and quote_pdf.py; the copies look identical, and only the Git history shows that they change together and once drifted apart for a week. The audit uses the history as its evidence.'
request: 'Audit this codebase: what should we improve? Tech debt, anti-patterns, anything worth fixing.'
graders:
- type: notes_only
- type: ran_command
  pattern: '\bgit\b.*\blog\b'
- type: judge
  rubric: 'Planted facts: pricing.py (used by invoicing) and quote_pdf.py (the text clients sign) each compute the quote total with the same formula: hours times rate times the margin, the weekend surcharge, rounded to whole euros. The two copies are identical now. The Git history shows they are one piece of knowledge kept in two places: commits on 2025-09-10, 2026-03-15 and 2026-07-20 changed both copies together, and the rounding fix reached quote_pdf.py on 2025-12-01 but pricing.py only on 2025-12-09, a commit whose message says invoices disagreed with the quotes clients signed. fmt_date is also written twice (quote_pdf.py and emails.py) but has not changed since the first commit. PASS only if (1) the reply, or a findings file it points to, reports the price formula kept in both pricing.py and quote_pdf.py as a finding; (2) it supports that finding with the history: that the copies changed together in several commits, or that the rounding fix reached one copy a week before the other so invoices disagreed with signed quotes; and (3) it proposes keeping the formula in one place. Where the agent also reports the fmt_date duplication, it must rank it below the price formula. FAIL if the price formula is missing, if its only support is that the code is repeated, or if fmt_date ranks above it. Also FAIL if the agent edited or created any file other than a Markdown note in the repository, at any point, even if it undid the change later. Git''s own files under .git/, such as a line added to .git/info/exclude, are not repository files and do not count, nor do caches that running the project''s checks creates, such as .ruff_cache or __pycache__, or the agent deleting them again, nor do files in the agent''s own working folder .code/, such as the saved output of a reproduction.'
