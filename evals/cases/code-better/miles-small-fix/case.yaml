id: miles-small-fix
rule: requirements-as-scenarios
source:
- modes/bug-fix.md
reads:
- modes/bug-fix.md
- formats/spec.md
- agents/verifier.md
situation: km_to_miles multiplies by KM_PER_MILE instead of dividing; a small fix with one obvious reading, so make it without
  stopping to have the user review requirements. A short spec sized to the fix is allowed.
request: km_to_miles(10) gives 16.09 but it should be about 6.21. Can you fix it?
graders:
- type: planted_unchanged
  except:
  - units.py
  - test_units.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: judge
  rubric: 'Rule: a small fix with one obvious reading goes ahead without the user reviewing requirements first; a spec
    for it, if the agent writes one, stays as small as the fix. Planted facts: km_to_miles in units.py multiplies by KM_PER_MILE
    (1.609344) instead of dividing by it; the request gives the input 10 km and the expected result of about 6.21 miles.
    PASS only if all of: (1) the agent made the fix without first asking the user to confirm, review or approve requirements
    or a spec; (2) any requirements document or section the agent wrote, in a file or in the reply, covers only the conversion
    the request names, such as km_to_miles(10) giving about 6.21, and adds no requirement the request does not imply; (3)
    the final reply does not ask the user to review or approve a spec or requirements. FAIL if any of: (a) the agent stopped
    to ask about requirements instead of making the fix; (b) a spec it wrote adds requirements beyond the conversion, such
    as new units, rounding rules, input validation or changes to other functions; (c) the reply asks the user to review or
    approve requirements. A spec of one to three requirements about km_to_miles, including that miles_to_km keeps working,
    counts as sized to the fix, and so does writing no spec at all. Do not grade the fix itself or how the agent checked
    it.'
