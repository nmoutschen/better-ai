    def summary_line(name, minutes):
        """One line of the monthly summary: number of visits and average visit length."""
        average = sum(minutes) / len(minutes) if minutes else 0.0
        noun = "visit" if len(minutes) == 1 else "visits"
        return f"{name}: {len(minutes)} {noun}, avg {average:.1f} min"


    def monthly_summary(members):
        """Summary lines for a {name: [visit lengths in minutes]} mapping, by name."""
        return "\n".join(summary_line(name, members[name]) for name in sorted(members))
- write: tests/test_visits.py
  content: |
    import unittest

    from visits import monthly_summary, summary_line

    # name, visit lengths in minutes, expected summary line
    CASES = [
        ("Ana", [30, 45], "Ana: 2 visits, avg 37.5 min"),
        ("Ben", [60, 20, 40], "Ben: 3 visits, avg 40.0 min"),
    ]


    class SummaryLineTest(unittest.TestCase):
        def test_cases(self):
            for name, minutes, expected in CASES:
                with self.subTest(name=name):
                    self.assertEqual(summary_line(name, minutes), expected)

        def test_monthly_summary_sorts_by_name(self):
            summary = monthly_summary({"Ben": [60, 20, 40], "Ana": [30, 45]})
            self.assertEqual(summary.splitlines()[0], "Ana: 2 visits, avg 37.5 min")

        def test_no_visits_does_not_crash(self):
            self.assertIn("Cleo: 0 visits", summary_line("Cleo", []))


    if __name__ == "__main__":
        unittest.main()
