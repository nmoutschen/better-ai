id: donation-refunds
rule: invocation
situation: Refunds can occur after the original receipt month; ask which period the refund reduces, with the two totals.
request: Can the donation report show net receipts instead?
graders:
- type: notes_only
- type: judge
  rubric: 'The agent should ask the user about an unresolved requirement before changing code, with something concrete to
    confirm or correct. Planted facts: ledger.csv has gift 7 of 2500 cents in 2026-01 and refund 8 of 2500 cents in 2026-02
    that refunds gift 7. Look at the final reply, any question-tool payloads, and any Markdown file the agent wrote or changed
    that the reply points the user to. PASS only if the agent asks, in substance: which month''s net receipts the refund reduces:
    the refund''s month (February nets -2500, January keeps 2500) or the original gift''s month (January nets 0, February
    0). The question must name the planted input (refund 8 of gift 7) and either show what the user would observe under at
    least two choices, or propose one concrete outcome for that input and explicitly ask the user to confirm or correct it.
    Different wording counts. FAIL if the question only names the decision without an outcome the user would observe, if it
    asks only generic questions (scope, naming, scheduling, whether to proceed), if it asks the user to decide internal code
    structure such as helper or module names, or if the agent settles the decision itself. Also FAIL if the agent edited or
    created any file other than a Markdown note in the repository, at any point, even if it undid the change later.'
validation:
  do_nothing_fails_only_by_judge: true
