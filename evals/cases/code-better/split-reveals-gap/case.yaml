id: split-reveals-gap
rule: design-decisions
source:
- SKILL.md#ask-the-user
- templates/design.md
reads: []
situation: 'Splitting the import into fetch and load raises a requirement gap: what happens when load fails halfway and is
  rerun; ask instead of deciding it in the design.'
request: Split the nightly import into a fetch step and a load step, so we can rerun just the load.
graders:
- type: notes_only
- type: judge
  rubric: 'The agent should ask the user about an unresolved requirement before changing code, with something concrete to
    confirm or correct. Planted facts: db.insert() writes each order to orders.json at once with no duplicate check, and in
    samples/feed.json the second order has no id, so a load stops after order 1 is stored; rerunning the load would store
    order 1 a second time. Look at the final reply, any question-tool payloads, and any Markdown file the agent wrote or changed
    that the reply points the user to. PASS only if the agent asks, in substance: what a rerun after a load that failed partway
    should do with orders already inserted: for example skip them (each order stored once), replace them, or insert them again
    (duplicates). The question must name the planted input (last night''s feed, where the load stops at the order without
    an id after storing order 1) and either show what the user would observe under at least two choices, or propose one concrete
    outcome for that input and explicitly ask the user to confirm or correct it. Different wording counts. FAIL if the question
    only names the decision without an outcome the user would observe, if it asks only generic questions (scope, naming, scheduling,
    whether to proceed), if it asks the user to decide internal code structure such as helper or module names, or if the agent
    settles the decision itself. Deciding it in a design, for example ''I will make the load idempotent'', without asking
    fails. Also FAIL if the agent edited or created any file other than a Markdown note in the repository, at any point, even
    if it undid the change later. Git''s own files under .git/, such as a line added to .git/info/exclude, are not repository
    files and do not count.'
validation:
  do_nothing_fails_only_by_judge: true
