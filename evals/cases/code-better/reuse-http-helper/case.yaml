id: reuse-http-helper
rule: '2'
source:
- SKILL.md#6
reads:
- modes/feature.md
- agents/verifier.md
situation: The project already has an HTTP helper for JSON APIs; the rates widget must fetch through it, not urllib, requests
  or a new dependency.
request: Show today's exchange rates on the dashboard as a “rates” widget, like “USD 1.08 · GBP 0.85”. They come from https://rates.example.org/today
  as JSON; samples/rates.json is a sample response.
graders:
- type: file_unchanged
  path: requirements.txt
# Built and working, or stopped before any code edit to ask: asking about open behaviour belongs to other rules.
- type: any_of
  graders:
  - type: command_passes
    cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
    files:
      check.py: checks/command_passes/check.py
  - type: notes_only
validation:
  do_nothing_fails_only_by_judge: true
