    import json
    import urllib.request


    def get_json(url):
        return json.load(urllib.request.urlopen(url))


    def rates_line():
        data = get_json("https://rates.example.org/today")
        return " · ".join(f"{code} {rate}" for code, rate in data["rates"].items())
