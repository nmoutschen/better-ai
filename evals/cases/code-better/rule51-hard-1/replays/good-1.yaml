  run_checks.py passes.'
actions:
- write: stock.py
  content: |
    import csv
    import io


    def read_stock(text):
        """Read (item, quantity) pairs from the warehouse's CSV export."""
        rows = []
        for row in csv.DictReader(io.StringIO(text)):
            rows.append((row["item"], int(row["qty"] or 0)))
        return rows


    def stock_report(text):
        """One line per item, then the total quantity."""
        rows = read_stock(text)
        lines = [f"{item}: {qty}" for item, qty in rows]
        lines.append(f"total: {sum(qty for _, qty in rows)}")
        return "\n".join(lines)
- write: check_stock.py
  content: |
    from stock import read_stock, stock_report

    assert read_stock("item,qty\nbolt,4\n") == [("bolt", 4)]
    assert stock_report("item,qty\nbolt,4\nnut,12\n") == "bolt: 4\nnut: 12\ntotal: 16"
    assert stock_report("item,qty\nbolt,4\nhinge,\n") == "bolt: 4\nhinge: 0\ntotal: 4"
    print("stock checks passed")
- bash: python run_checks.py
