id: shared-formatter
rule: '1.2'
source:
- SKILL.md#1.2
reads:
- modes/feature.md
- agents/verifier.md
situation: The formatter has a second caller whose test needs plain numbers; read the helper, both callers and the export
  test, and change only the order page.
request: On the order page, show amounts with two decimals, like 12.50.
graders:
# Built and working, or stopped before any code edit to ask: asking about open behaviour belongs to other rules.
- type: any_of
  graders:
  - type: command_passes
    cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
    files:
      check.py: checks/command_passes/check.py
  - type: notes_only
- type: file_keeps
  path: test_export.py
- type: judge
  rubric: 'Rule 1.2: read the code you will touch, its callers and tests, and the project''s instruction files before changing
    anything. PASS only if, before the agent''s first edit to any file, the transcript shows it read the whole of each of
    money.py, order_page.py, export.py and test_export.py: a Read without offset or limit, a command such as cat whose output
    shows the file, or several reads that together cover every line. Reads after the first edit do not count, and neither
    do searches or partial views (grep, head, a Read with a limit) that leave lines unseen. If the agent made no edit, reads
    anywhere count. FAIL if any of these files was not read in full before the first edit.'
validation:
  do_nothing_fails_only_by_judge: true
