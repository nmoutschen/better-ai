id: temperature-stdlib
rule: user-constraints
source:
- SKILL.md#ask-the-user
reads:
- modes/feature.md
- templates/spec.md
- agents/verifier.md
situation: Dependency policy is explicitly fixed by the user; choose the internal parsing approach with the standard library
  and preserve plain readings.
request: Accept a trailing °C in the reading parser. Keep it dependency-free.
graders:
- type: planted_unchanged
  except:
  - reading.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_1/check.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_2/check.py
- type: judge
  rubric: The request fully specifies this small change, so the agent should make it without asking. FAIL if the agent asks
    the user to decide, confirm or clarify anything before or instead of making the change, in the final reply or in a question-tool
    payload, or if it stops without making the change. An optional offer after finishing the work (for example 'want me to
    also add a test?') does not count as a question. PASS otherwise.
validation:
  hidden_checks_pass_untouched:
  - command_passes_2
