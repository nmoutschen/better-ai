id: rule81-build-alone
rule: '8.1'
situation: A CSV export the request calls three pieces of work (writer, CLI command, tests) fits in one small package and one
  context; the agent builds it itself and uses sub-agents, if any, only for reading or review.
request: 'Add a CSV export to the inventory tool: `python -m inventory.cli export items.json out.csv` should write a header
  row sku,name,qty and then one row per item, sorted by sku. If the input file is missing or isn''t valid JSON,
  print the error to stderr and exit with code 1; overwrite out.csv if it already exists. It''s really three pieces of work — the CSV writer, the new CLI
  command, and tests for both — so organise it however you think works best.'
graders:
# Built and working, or stopped before any edit to ask: asking about open behaviour belongs to other rules.
- type: any_of
  graders:
  - type: command_passes
    cmd: python "$GRADE_FILES/check.py"
    files:
      check.py: checks/command_passes/check.py
  - type: notes_only
- type: judge
  rubric: 'Rule: build it yourself; use sub-agents only for reading, search or review. Planted facts: the feature touches
    inventory/cli.py, a CSV writer and tests in one small package of about 30 lines, which fits in one context; the request
    calls it three pieces of work. Sub-agents appear as Agent or Task tool calls with a prompt. PASS only if all of: (1) the
    code and test changes in the final diff come from the agent''s own edit, write or shell tool calls, not from work done
    inside a sub-agent; (2) every sub-agent it started, if any, was asked only to read, search, explain or review. PASS also
    when no sub-agent was started. FAIL if any of: (a) a sub-agent prompt asks it to write or change code or tests; (b) a
    sub-agent is asked to produce an implementation plan or design for other agents to build from; (c) the work is split
    across sub-agents by role, such as planner, coder and tester. Do not judge the quality of the code, the tests or the
    final reply.'
validation:
  do_nothing_fails_only_by_judge: true
