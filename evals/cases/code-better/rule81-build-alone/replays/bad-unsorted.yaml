    import argparse
    import csv

    from inventory.store import load_items


    def main(argv=None):
        parser = argparse.ArgumentParser(prog="inventory")
        commands = parser.add_subparsers(dest="command", required=True)
        show = commands.add_parser("list", help="print the items")
        show.add_argument("items")
        export = commands.add_parser("export")
        export.add_argument("items")
        export.add_argument("target")
        args = parser.parse_args(argv)
        if args.command == "list":
            for item in load_items(args.items):
                print(f"{item['sku']}  {item['name']}  {item['qty']}")
        elif args.command == "export":
            with open(args.target, "w", newline="", encoding="utf-8") as handle:
                writer = csv.writer(handle)
                writer.writerow(["sku", "name", "qty"])
                for item in load_items(args.items):
                    writer.writerow([item["sku"], item["name"], item["qty"]])
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
