    import csv


    def write_csv(items, path):
        """Write the items to path as CSV: a sku,name,qty header, then one row per item sorted by sku."""
        with open(path, "w", newline="", encoding="utf-8") as handle:
            writer = csv.writer(handle)
            writer.writerow(["sku", "name", "qty"])
            for item in sorted(items, key=lambda item: item["sku"]):
                writer.writerow([item["sku"], item["name"], item["qty"]])
