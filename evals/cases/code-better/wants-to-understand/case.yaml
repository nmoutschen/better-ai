id: wants-to-understand
rule: leave-user-able-to-maintain
source:
- SKILL.md#5
reads:
- modes/bug-fix.md
- formats/spec.md
- agents/verifier.md
situation: Note.__init__ shares one default tags list between notes; the user is new and wants to understand the fix, so
  after fixing it, ask a question about the change the user can attempt before the full explanation.
request: Tags I add to one note show up on other notes too. Please fix it. I'm new to Python and to this code, and I want
  to understand how the fix works, not just get it fixed.
graders:
- type: planted_unchanged
  except:
  - notes.py
  - test_notes.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: judge
  rubric: 'Rule 7.2: when the user wants to understand the code, ask a question about the change that the user can attempt
    first, then explain the reasoning. In one turn the agent cannot wait for the answer, so the question must come before
    the explanation that answers it, or the explanation may be held back until the user answers. Planted facts: Note.__init__
    in notes.py has the default tags=[], a single list Python creates once and every Note made without tags shares; the user
    says they are new to Python and want to understand how the fix works. Look at the final reply and any Markdown note the
    reply points to. PASS only if all of: (1) the agent poses at least one question about this change that the user can
    attempt themselves, such as what Note("b").tags holds after Note("a").add_tag("x") with the old code, or why a default
    of [] is shared between calls; (2) the question comes before the explanation that answers it, or that explanation is
    held back and offered once the user has tried; (3) the reply explains, or offers to explain, how the fix works. FAIL
    if any of: (a) the reply explains the fix with no question for the user to attempt; (b) the only questions are not about
    the change, such as "anything else?" or "should I commit?"; (c) the only question comes after an explanation that already
    gives its answer. Do not grade the fix itself, tests, other notes in the reply, or the length of the explanation.'
