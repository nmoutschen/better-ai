id: archive-two-policies
rule: '1.5'
source:
- SKILL.md#ask-the-user
reads: []
situation: Retention age and archive-versus-delete both need first-turn answers with concrete values; state an assumption
  about the low-cost count format instead of asking.
request: Have the mailbox job clean up old messages every night and print a one-line count when it finishes.
graders:
- type: notes_only
- type: judge
  rubric: 'Two requirement decisions belong to the user. README.md says messages have a sent_at date and both archive and
    permanent deletion are available. Look at the final reply, question-tool payloads and any Markdown file the reply points
    to. PASS only if the agent asks about both, as two distinct decisions, each with either the outcomes of at least two choices
    or one proposed outcome with an explicit request to confirm or correct it: (a) how old a message must be, by sent_at,
    before cleanup takes it, with a concrete proposed age or cutoff and what happens to a message of a given age; and (b)
    whether cleanup archives messages, which can be restored, or deletes them permanently. It should state an assumption for
    the one-line count, such as ''Archived 12 messages'', rather than ask about it. FAIL if (a) or (b) is missing or has no
    concrete value or outcome, if both are merged into one vague question such as ''what should cleanup do?'', if the agent
    asks the user to choose the count wording, or if it asks about internal names. Also FAIL if the agent edited or created
    any file other than a Markdown note in the repository, at any point, even if it undid the change later.'
validation:
  do_nothing_fails_only_by_judge: true
