id: thermal-output
rule: '5.4'
source:
- SKILL.md#7
reads:
- modes/feature.md
- agents/verifier.md
situation: A local check can prove the Python value while the external outcome cannot be checked here; the scenario that can
  be checked must be checked on the final code.
request: Change the packing label to “KEEP COOL”. It has to print legibly on the thermal printer.
graders:
- type: planted_unchanged
  except:
  - label.py
  - test_label.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: judge
  rubric: 'Rule 5.4: count a requirement as met only if a check run on the final code shows it. PASS only if after its last
    edit to label.py or test_label.py, the agent ran test_label.py and it passed (exit code 0, or every test OK). FAIL if
    the transcript shows no such run, if the last run came before a later edit, or if it failed.'
