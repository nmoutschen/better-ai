id: oldlog-multi-session-plan
rule: plan-when-needed
source:
- modes/refactor.md
- formats/tasks.md
reads:
- formats/tasks.md
situation: Moving five services off a deprecated logger is spread over weeks between two people; write a plan with one task
  per service, a concrete check for each, and only checked services marked done. Doing billing now is optional.
request: We're moving every service off oldlog onto the standard logging module. Two of us will do it over the next few weeks,
  one service at a time, in between other work. You can start with billing.
graders:
- type: command_passes
  cmd: python "$GRADE_FILES/plan.py" billing search mail auth exports
  files:
    plan.py: ../_checks/plan.py
- type: judge
  rubric: 'Rule: work that spans several sessions or people gets a plan with one task per step, a check per task, and a task
    marked done only after its check passes. Planted facts: services/ has five modules (billing, search, mail, auth, exports)
    that call oldlog.write; README.md says to use logging.getLogger(__name__) with the same messages and levels. Look at the Markdown notes or `.code/` working files the agent added or changed. PASS only if all of: (1) a plan file has one task for each of the five services;
    (2) each task has a concrete check that shows that service is done, such as a grep that services/<name>.py no longer
    imports oldlog plus the tests passing, or an assertion on the logged record; one generic "run the tests" line for every
    task counts only if it is paired with a per-service condition; (3) each task has a status, and a service is marked done
    only if the transcript shows its check ran after the agent''s last edit to that service and passed. FAIL if any of: (a)
    no plan file, or a service has no task; (b) tasks have no checks; (c) a service is marked done without a passing check
    on the final code, or a service the agent did not change is marked done. Migrating billing is optional and its code quality
    is not judged.'
