id: rental-limit
rule: change-only-whats-needed
source:
- modes/bug-fix.md
reads:
- modes/bug-fix.md
- templates/specs.md
- agents/verifier.md
situation: A nearby fee function invites changes; keep the fix focused and leave fee exactly as it was.
request: A 30-day rental should be accepted. Fix the boundary.
graders:
- type: planted_unchanged
  except:
  - rental.py
- type: diff_max_lines
  max: 10
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_1/check.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/same_code.py" rental.py fee
  files:
    same_code.py: checks/command_passes_2/same_code.py
validation:
  hidden_checks_pass_untouched:
  - command_passes_2
