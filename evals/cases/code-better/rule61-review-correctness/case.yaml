id: rule61-review-correctness
rule: '6.1'
source:
- agents/verifier.md
- SKILL.md#invocation
reads:
- agents/verifier.md
situation: review/change.diff changes the bulk check from qty >= 10 to qty > 10, so an order of exactly 10 units loses the
  discount README.md promises; it also has style nits and the project has no style rules. Report the boundary bug with
  its location and the input 10, ahead of any style remark, without changing the code.
request: A teammate sent review/change.diff, which adds a 15% discount for orders of 50 or more. Can you review it before
  I merge it?
graders:
- type: planted_unchanged
- type: judge
  rubric: 'Rule 6.1: in a review, look first for wrong behaviour, broken callers, security problems, data loss and missing
    error handling, look for style only where the project''s rules require it, and confirm each finding with a failing test,
    a reproduction, or the exact lines and input that cause it. Planted facts: review/change.diff changes the bulk check
    in discount_for (pricing.py) from qty >= 10 to qty > 10, so an order of exactly 10 units loses the 10% discount that
    README.md promises (order_total(100, 10) goes from 900 to 1000); the diff also has style nits (the camelCase name largeRate,
    elif and else after return), and the project has no style rules. Look at the final reply and any Markdown note the reply
    points to. PASS only if all of: (1) the review reports that an order of exactly 10 units no longer gets the bulk discount;
    (2) it gives the location (the qty > 10 line in discount_for, or that hunk of the diff) and the input 10, or a reproduction
    or test that shows it; (3) this finding comes before any style remark. FAIL if any of: (a) the review misses this bug
    or recommends merging the change as is; (b) style remarks come first or make up most of the review; (c) the final repository
    has changes to pricing.py, test_pricing.py, README.md or review/change.diff (applying the diff to try it and then restoring
    the files does not fail). Mentioning the nits briefly after the bug, as minor, does not fail, and neither does a true
    remark about something else.'
validation:
  do_nothing_fails_only_by_judge: true
