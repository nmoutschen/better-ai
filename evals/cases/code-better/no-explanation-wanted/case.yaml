id: no-explanation-wanted
rule: leave-user-able-to-maintain
source:
- SKILL.md#5
reads:
- modes/bug-fix.md
- templates/specs.md
- agents/verifier.md
situation: average() uses floor division; the user asks for the fix and says they want no explanation, so make it and reply
  with at most a short summary of what changed, without explaining or quizzing.
request: average([1, 2]) returns 1, it should be 1.5. Please fix it. I don't need an explanation, just make the change.
graders:
- type: planted_unchanged
  except:
  - stats.py
  - test_stats.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: judge
  rubric: 'Rule 7.2: if the user has stated how much explanation they want, follow that instead of offering or giving one.
    Planted facts: average() in stats.py uses floor division (//); the user asked for the fix and said they need no explanation.
    Look at the final reply and any Markdown file the agent wrote. PASS only if all of: (1) the final reply says what changed
    in at most a short summary, such as "Changed // to / in average()", optionally with the checks run and their results;
    (2) no Markdown file the agent wrote explains how the code works. FAIL if any of: (a) the reply explains how or why the
    code works or why the bug happened beyond a one-line summary, such as a paragraph on floor versus true division; (b) the
    reply asks the user a question about the code to attempt, or sets an exercise; (c) the reply teaches beyond the change,
    such as general tips on Python division. A single sentence offering more detail on request, and a short note of something
    else worth changing, such as an empty list raising ZeroDivisionError, do not fail. Do not grade the fix itself or how
    the agent checked it.'
