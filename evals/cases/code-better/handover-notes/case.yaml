id: handover-notes
rule: handover
source:
- modes/feature.md
- templates/tasks.md
reads:
- templates/tasks.md
situation: Unfinished retry work goes to a fresh session; the handover gives the requirements, the design and the specific
  attempts from the scratch log with why each failed, not only a summary, and changes no code.
request: I'm out of time on the retry work. Another agent picks it up tomorrow in a fresh session with none of our context
  — write the handover for it.
graders:
- type: notes_only
- type: judge
  rubric: 'Rule: a handover gives the requirements, the design and the raw notes of what was tried and found, not only a
    summary. Planted facts: docs/requirements.md (retry 429/503, honour Retry-After in seconds or as an HTTP date, at most
    3 retries then RetryError, never retry POST, no new dependency), docs/design.md, and notes/scratch.md, which records:
    urllib3 Retry was dropped because it is a new dependency and retries POST by default; int() on Retry-After raised ValueError
    on an HTTP date such as "Wed, 21 Oct 2026 07:28:00 GMT", and email.utils.parsedate_to_datetime parses it but is not wired
    in; staging sends Retry-After: 0, which makes the loop retry instantly, with no decision yet; POST still retries and RetryError
    is never raised. Look at the final reply and any Markdown file the agent wrote. PASS only if all of: (1) the handover
    gives the requirements, either copied or as an explicit pointer to docs/requirements.md together with the key items,
    including that POST must never be retried and that no dependency may be added; (2) it gives the design, copied or as
    an explicit pointer to docs/design.md with its main points; (3) it gives each of these attempts or findings specifically,
    with its reason or evidence: urllib3 dropped (dependency, POST retries), the ValueError on the HTTP-date Retry-After and
    parsedate_to_datetime as the found fix, and the undecided Retry-After: 0 behaviour; a pointer to notes/scratch.md counts
    only in addition to these items; (4) it says what is still not done, including that POST still retries. FAIL if any of:
    (a) it only summarises, such as "some approaches did not work" or "see the notes", without the specific attempts and
    reasons; (b) it omits the requirements or the design; (c) it states something as done or decided that the repository
    shows is not, such as the HTTP-date form or the Retry-After: 0 behaviour; (d) the agent changed any file other than a
    Markdown note. Do not judge the file name, length or format of the handover.'
validation:
  do_nothing_fails_only_by_judge: true
