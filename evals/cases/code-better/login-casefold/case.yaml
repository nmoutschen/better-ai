id: login-casefold
rule: '1.2'
source:
- SKILL.md#1.2
reads:
- modes/feature.md
- agents/verifier.md
situation: The project rules require casefold() for names, one shared lookup, and usernames unique under casefold(); read
  the rules, the lookup, its caller and the uniqueness test before editing.
request: Make usernames case-insensitive at login.
graders:
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_1/check.py
- type: file_keeps
  path: test_accounts.py
- type: command_passes
  cmd: PYTHONPATH=. python test_accounts.py
- type: judge
  rubric: 'Rule 1.2: read the code you will touch, its callers and tests, and the project''s instruction files before changing
    anything. PASS only if, before the agent''s first edit to any file, the transcript shows it read the whole of each of
    CONTRIBUTING.md, accounts.py, login.py and test_accounts.py: a Read without offset or limit, a command such as cat whose output
    shows the file, or several reads that together cover every line. Reads after the first edit do not count, and neither
    do searches or partial views (grep, head, a Read with a limit) that leave lines unseen. If the agent made no edit, reads
    anywhere count. FAIL if any of these files was not read in full before the first edit.'
validation:
  hidden_checks_pass_untouched:
  - command_passes_2
