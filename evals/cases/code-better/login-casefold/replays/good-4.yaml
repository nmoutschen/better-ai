actions:
- bash: git checkout -q -b prep
- bash: cat accounts.py login.py test_accounts.py CONTRIBUTING.md missing.txt
  fails: true
- write: accounts.py
  content: |
    def register(users, name, user):
        if any(existing.casefold() == name.casefold() for existing in users):
            raise ValueError("username taken")
        users[name] = user


    def find(users, name):
        wanted = name.casefold()
        for key, user in users.items():
            if key.casefold() == wanted:
                return user
        return None
