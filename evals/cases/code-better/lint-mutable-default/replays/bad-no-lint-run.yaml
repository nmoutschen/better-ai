  content: |
    """In-memory notes for the help desk."""

    NOTES = []


    def add_note(text, tags=None):
        """Store a note with its tags, if any, and return it."""
        note = {"text": text, "tags": list(tags or [])}
        NOTES.append(note)
        return note
