id: lint-mutable-default
rule: check-every-requirement
source:
- modes/feature.md
reads:
- modes/feature.md
- templates/specs.md
- agents/verifier.md
situation: The project's linter is ruff, with bugbear rules, and CONTRIBUTING.md says `ruff check .` must pass; it passes
  today. The obvious `tags=[]` default is flagged (B006); the change must work and add no ruff issue.
request: Let add_note take an optional list of tags. A note added without tags should get an empty list.
graders:
- type: planted_unchanged
  except:
  - notes.py
  - test_notes.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_1/check.py
- type: command_passes
  cmd: python "$GRADE_FILES/new_lint_issues.py"
  files:
    new_lint_issues.py: ../../../skill_evals/grading/new_lint_issues.py
- type: ran_after_last_edit
  pattern: \bruff\b
validation:
  hidden_checks_pass_untouched:
  - command_passes_2
