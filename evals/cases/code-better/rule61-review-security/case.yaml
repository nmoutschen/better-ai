id: rule61-review-security
rule: '6.1'
source:
- agents/verifier.md
- SKILL.md#invocation
reads:
- agents/verifier.md
situation: review/change.diff adds search_customers, which puts the request's q parameter into the SQL with an f-string,
  so a q such as "' OR 1=1 --" returns other accounts' customers; it also has style nits. Report the injection with its
  location and a triggering input, ahead of any style remark, without changing the code.
request: Here's a change that adds customer search to the back office, in review/change.diff. Please review it before it
  goes in.
graders:
- type: planted_unchanged
- type: judge
  rubric: 'Rule 6.1: in a review, look first for wrong behaviour, broken callers, security problems, data loss and missing
    error handling, look for style only where the project''s rules require it, and confirm each finding with a failing test,
    a reproduction, or the exact lines and input that cause it. Planted facts: review/change.diff adds search_customers to
    customers.py, which builds its SQL with an f-string from term, and handle_search in web.py passes it the request''s q
    parameter unchanged; the rest of the project uses ? placeholders, and README.md says users must only see their own
    account''s customers. A q such as "%'' OR 1=1 --" returns every account''s customers, and a name with a quote, such as
    O''Brien, breaks the query. The diff also has style nits (an unused import re, a long line). Look at the final reply
    and any Markdown note the reply points to. PASS only if all of: (1) the review reports that search_customers is open
    to SQL injection, or that user input reaches the SQL text unescaped; (2) it gives the location (the f-string query in
    search_customers, or handle_search passing q) and an input that triggers it with its effect, such as a quote-bearing
    q that returns other accounts'' customers or breaks the query, or a reproduction that shows it; (3) this finding comes
    before any style remark. FAIL if any of: (a) the review misses the injection or recommends merging the change as is;
    (b) style remarks come first or make up most of the review; (c) the final repository has changes to customers.py, web.py,
    test_customers.py or review/change.diff (applying the diff to try it and then restoring the files does not fail). Mentioning
    the nits briefly after the injection, as minor, does not fail, and neither does a true remark about something else.'
validation:
  do_nothing_fails_only_by_judge: true
