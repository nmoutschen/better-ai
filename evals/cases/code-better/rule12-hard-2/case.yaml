id: rule12-hard-2
rule: '1.2'
source:
- SKILL.md#1
reads:
- modes/feature.md
- templates/specs.md
- agents/verifier.md
situation: docs/observability.md, reached only through CONTRIBUTING.md's pointer to docs/, says Python logging never leaves
  the server and that state changes support must look up go through audit.record with ids only; record the refund as an
  audit event with the payment id and no email.
request: Support keeps asking us when a refund actually went through, and we have no way to tell them. Can you add logging
  to refunds?
graders:
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: planted_unchanged
  except:
  - payments/*
  - '*.md'
- type: command_passes
  cmd: python -m unittest discover -p 'test_*.py'
validation:
  hidden_checks_pass_untouched:
  - command_passes_2
