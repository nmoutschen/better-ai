- write: report.py
  content: |
    import json
    import sys


    def summarize(rows):
        return {"count": len(rows), "total": sum(rows)}


    def main(argv):
        data = summarize([3, 4, 5])
        if "--json" in argv:
            print(json.dumps(data))
            return
        print(f"{data['count']} rows, total {data['total']}")


    if __name__ == "__main__":
        main(sys.argv[1:])
- bash: python report.py > out.txt && printf '3 rows, total 12\n' | cmp - out.txt && rm out.txt
