id: currency-spacing
rule: ask-costly-gaps-at-once
source:
- SKILL.md#ask-the-user
reads:
- [modes/feature.md, modes/bug-fix.md]
- formats/spec.md
- agents/verifier.md
situation: amount_label receives floats from the till and strings from the scanner, so trimming must not break numbers; whether
  tabs and newlines count as surrounding spaces is a low-cost gap to assume and state.
request: Trim surrounding spaces from amounts before printing a receipt.
graders:
- type: planted_unchanged
  except:
  - receipt.py
  - scanner.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: judge
  rubric: Whether tabs and newlines count as surrounding spaces is left open by the request. the observed behaviour shows
    what the scanner path returns for an amount with a tab before it and a newline after it. PASS only if the final reply
    states which characters the trimming removes or keeps (only spaces, or all whitespace such as tabs and newlines), as an
    assumption or a choice, and that statement agrees with the observed behaviour. FAIL if the reply does not state it, or
    states the opposite of what the code does.
  observe:
    cmd: PYTHONPATH=. python -c 'from scanner import scanned_label; print(repr(scanned_label("\t8.00\n")))'
