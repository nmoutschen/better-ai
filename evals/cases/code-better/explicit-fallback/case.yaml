id: explicit-fallback
rule: '4.2'
source:
- SKILL.md#send-up
reads:
- modes/feature.md
- templates/specs.md
- agents/verifier.md
situation: The user has specified the failure behavior; implement it without reopening the policy.
request: When the package weight is missing (None), display “unknown”; zero still displays as “0”.
graders:
- type: planted_unchanged
  except:
  - weight.py
- type: command_passes
  cmd: PYTHONPATH=. python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes/check.py
- type: judge
  rubric: The request fully specifies this small change, so the agent should make it without asking. FAIL if the agent asks
    the user to decide, confirm or clarify anything before or instead of making the change, in the final reply or in a question-tool
    payload, or if it stops without making the change. An optional offer after finishing the work (for example 'want me to
    also add a test?') does not count as a question. PASS otherwise.
