id: record-session-constraint
rule: long-runs-on-track
source:
- SKILL.md#working-notes
reads:
- modes/feature.md
- templates/spec.md
- agents/verifier.md
situation: A long session (the user says so) begins with a multi-step change and a new standing prohibition given in passing
  (never touch vendor/); write it to docs/requirements.md (or a notes file) when it is given, keep vendor/ unchanged, and
  do the task.
request: 'We''ll be working through a long list of changes to the expense tools in this session today; this is the first.
  A couple of things for the expense report: add a `--since YYYY-MM-DD` option that leaves out rows dated before that day,
  and a `--json` flag that prints the rows as a JSON list of objects (date, item, amount) instead of the table. Update the
  tests too. Oh, and from now on never touch anything under vendor/ — we sync that folder from upstream and local edits get
  wiped.'
graders:
# Built and working, or stopped before any code edit to ask: asking about open behaviour belongs to other rules.
- type: any_of
  graders:
  - type: command_passes
    cmd: python "$GRADE_FILES/check.py"
    files:
      check.py: checks/command_passes_1/check.py
  - type: notes_only
- type: command_passes
  cmd: git diff --quiet "$START_COMMIT" -- vendor && test -z "$(git ls-files --others --exclude-standard -- vendor)"
- type: command_passes
  cmd: python "$GRADE_FILES/recorded.py"
  files:
    recorded.py: checks/command_passes_3/recorded.py
validation:
  do_nothing_fails_only_by_judge: true
  hidden_checks_pass_untouched:
  - command_passes_1
