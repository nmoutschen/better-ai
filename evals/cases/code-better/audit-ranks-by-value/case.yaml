id: audit-ranks-by-value
rule: audit-ranks-by-value
source:
- modes/audit.md
reads:
- modes/audit.md
situation: 'Two findings cost money now (invoices with the old VAT rate, failed charges marked paid); the rest are cheaper debt or cosmetic. The audit puts the two costly ones first.'
request: 'Audit this codebase: what should we improve? Tech debt, anti-patterns, anything worth fixing.'
graders:
- type: notes_only
- type: judge
  rubric: 'Planted facts, in order of value: (A) invoice.py still uses VAT 0.20 while checkout.py charges 0.21 and the README says VAT is 21% since 1 January 2026; the 2026-01-05 commit changed checkout.py only, so every invoice since then shows less VAT and a lower total than the amount charged. (B) payments.charge swallows every exception and returns True after five failed attempts, so an order is marked paid when no money was taken. (C) invoice.py has no tests, and the VAT computation is written twice (checkout.py and invoice.py). Lower value: (D) shipping_cost''s legacy_mode flag, which no caller passes; (E) exporters.py, an exporter registry nothing imports; (F) the camelCase name calcWeight; (G) commented-out coupon code in checkout.py; (H) the bare retry count 5 in payments.py; (I) the leftover print(''DEBUG'', order) in shop.py; (J) the unused import json in checkout.py; (K) the unnamed shipping prices 495, 895 and 700 in shipping.py; (L) shipping.py has no tests. PASS only if the reply names both A and B as findings, and neither of them comes after any of D to L in the reply''s list of findings. Where the reply points to a findings file for the full list, the same holds for the file''s list. C may come anywhere. A passing mention outside the list of findings, such as a summary of lint output, does not count as a finding''s place. FAIL if A or B is missing from the reply, or if any of D to L comes before A or B in the reply''s or the file''s list of findings. Also FAIL if the agent edited or created any file other than a Markdown note in the repository, at any point, even if it undid the change later. Git''s own files under .git/, such as a line added to .git/info/exclude, are not repository files and do not count, nor do caches that running the project''s checks creates, such as .ruff_cache or __pycache__, or the agent deleting them again, nor do files in the agent''s own working folder .code/, such as the saved output of a reproduction.'
validation:
  do_nothing_fails_only_by_judge: true
