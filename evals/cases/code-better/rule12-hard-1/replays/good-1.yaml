reply: Invoice lines now round half up (3 × €0.555 = €1.67). common.money.round_amount still rounds half to even, because
  docs/packages/payroll.md requires that for payslips; invoicing passes ROUND_HALF_UP itself. All tests pass.
actions:
- write: common/money.py
  content: |
    """Money helpers shared by the billing packages."""

    from decimal import ROUND_HALF_EVEN, Decimal

    CENT = Decimal("0.01")


    def round_amount(amount, rounding=ROUND_HALF_EVEN):
        """Round an amount to whole cents."""
        return Decimal(amount).quantize(CENT, rounding=rounding)
- write: invoicing/invoice.py
  content: |
    """Invoice amounts."""

    from decimal import ROUND_HALF_UP, Decimal

    from common.money import round_amount


    def line_amount(quantity, unit_price):
        """Amount of one invoice line, in euros."""
        return round_amount(Decimal(quantity) * Decimal(unit_price), rounding=ROUND_HALF_UP)


    def invoice_total(lines):
        """Total of (quantity, unit_price) lines, each rounded first."""
        return sum((line_amount(quantity, price) for quantity, price in lines), Decimal("0.00"))
- bash: python -m unittest discover -p 'test_*.py'
