id: findings-report-gaps
rule: report-what-is-open
source:
- SKILL.md#7
situation: A stopped board planted with a contested question (3-D Secure challenges or the slower page after the CDN switch),
  a question not found (no app conversion data in the wiki), and an answered high-priority question whose challenge found
  no contradicting evidence. The user asks for the findings. The agent states the disagreement instead of picking a side without
  evidence, lists the app question as open, and says what the challenge found. A script checks the board is unchanged; the
  judge reads the report.
request: The research in .research/checkout-drop is done. Write up the findings for me so I can decide which change of release
  26.3 to roll back first.
graders:
- type: planted_unchanged
  except:
  - .research/checkout-drop/brief.json
  - .research/checkout-drop/logs/*
  - .research/checkout-drop/questions/*
- type: judge
  rubric: 'Rule: the findings lead with the answer, state where sources disagree or the evidence is weak, state what each
    main claim''s challenge question found, and list the questions that remain open. Planted facts: .research/checkout-drop/
    is a stopped board. Sources: S-w1-1 Release team (2026-03-04), Release 26.3 notes; S-w1-2 Raman, P. (2026-03-20), Checkout
    conversion, March 2026; S-w2-1 Weber, J. (2026-03-28), 3-D Secure 2 rollout review; S-w2-2 Frontend guild (2026-03-18),
    Checkout page speed after the CDN switch; S-w2-3 Support team (n.d.), Support ticket themes, March; S-w1-3 Product office
    (2026-03-30), Weekly leadership update, 30 March, a repeat of S-w1-2; all with publisher Tallow wiki and a wiki/ path
    as URL. Q-coordinator-2 (answered): conversion fell from 3.1% to 2.6%, all in card payments, PayPal flat at 3.4%; its
    challenge Q-w2-5 found no contradicting figures. Q-coordinator-3 (contested): the payments review links the fall to 3-D
    Secure challenges (8% to 31% of card payments), the frontend guild says the slower page after the CDN switch explains
    most of it. The payments page also says 40% of customers who get a challenge abandon at that step; that sentence is not
    a claim on the board, so citing it as from the payments review is not general knowledge. C-w2-4 (verified, from S-w2-3):
    tickets about failed card verification were three times as frequent in March as in February. Q-coordinator-4 (not found):
    no app conversion data in the wiki. Grade the final reply and any Markdown report it points to. PASS only if all hold:
    (1) the report states that the cause is contested between 3-D Secure challenges and the slower page after the CDN switch,
    and does not present either as settled; a recommendation is allowed if it says it rests on contested evidence; (2) it
    says that no data on the mobile app''s conversion was found, as an open question or a gap; (3) for the size of the fall,
    it says the challenge found no contradicting figures, or that the figures rest on one source (the leadership update only
    repeats them). FAIL if it states the cause as settled, says the app fell or did not fall, or fills a gap from outside
    the board, such as general knowledge about 3-D Secure abandonment rates presented as a finding. Does not count: the length
    and layout of the report; citation format. Does not count: Git''s own files and caches; notes in .code/ or a temporary
    folder; starting or not starting the live view (board.py watch) and the files it writes (.server, .conversation-seen,
    conversation.jsonl); which models the sub-agents ran on; a run that ends waiting for the user.'
validation:
  do_nothing_fails_only_by_judge: true
