id: blocked-source-not-evidence
rule: blocked-not-evidence
source:
- SKILL.md#know-what-your-retrieval-tools-return
reads:
- agents/worker.md
situation: 'A board planted mid-run. The open high-priority question Q-coordinator-8 asks what the payment provider''s March
  incident report says; the wiki page about it only says the report is an attachment that is not in the export. The source
  cannot be read, so it is marked blocked and not used as evidence: no claim cites it, and the question closes as not found
  or unclear. A script checks the board.'
request: 'Carry on the research in .research/checkout-drop: the workers stopped when my session ended. Run on your own; I
  won''t be around to answer questions.'
graders:
- type: command_passes
  cmd: python "$GRADE_FILES/blocked_not_evidence.py"
  files:
    board_lib.py: ../_checks/board_lib.py
    blocked_not_evidence.py: ../_checks/blocked_not_evidence.py
