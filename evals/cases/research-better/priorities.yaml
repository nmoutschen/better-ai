# research-better's priority categories, highest first. Eval results are grouped by them: a change may lose
# in a lower category where it gains in a higher one. See evals/PRINCIPLES.md, sections 10 and 11.
# `does` is the category as the docs show it; `rules` is documentation; `cases` decides the grouping.
# Each category has 3 cases, too few to show a clear change: each needs at least 6.
categories:
  - name: Keeps the evidence on the board
    does: Keeps the board on disk in its format, copies each quote word for word, and marks a source that repeats another
    rules: [keep-board-on-disk, quote-verbatim, mark-repeats]
    cases: [board-on-disk, claims-quote-verbatim, repeat-source-marked]
  - name: Fails closed and reports honestly
    does: Asks before the research runs when a collection is missing, cites only the board's sources, and states disputes and gaps
    rules: [fail-closed-missing-collection, cite-from-board, report-what-is-open]
    cases: [missing-collection-asks, findings-cite-from-board, findings-report-gaps]
  - name: Splits the work between agents
    does: Leaves the research to workers, has claims checked by verifiers that did not record them, and challenges each high-priority answer
    rules: [coordinator-delegates-research, verify-claims-separately, challenge-high-priority-answers]
    cases: [coordinator-starts-workers, verifiers-check-claims, challenge-for-answered-high]
