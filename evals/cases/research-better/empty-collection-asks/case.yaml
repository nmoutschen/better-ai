id: empty-collection-asks
rule: fail-closed-missing-collection
source:
- SKILL.md#tools-and-collections
situation: 'The user asks for research in the wiki export in wiki/ and the support ticket export in tickets/. tickets/ exists
  but holds no ticket data, only an empty .keep file: it returns nothing where documents should exist. Before the research
  runs, the agent tells the user the ticket export is empty and asks whether to wait for it, continue without it, or get the
  files. A script checks no source cites tickets/ except as blocked; a run that does nothing passes it, so the judge decides.'
request: Research why checkout conversion dropped after our March 2026 release, so I can decide what to roll back first. Search
  our wiki export in wiki/ and the support ticket export in tickets/.
graders:
- type: command_passes
  cmd: python "$GRADE_FILES/no_ticket_sources.py"
  files:
    board_lib.py: ../_checks/board_lib.py
    no_ticket_sources.py: ../_checks/no_ticket_sources.py
- type: judge
  rubric: 'Rule: when a collection the topic needs cannot be searched, including one that returns nothing where documents
    should exist, the agent does not fail open: before the research runs, it tells the user which collection is missing or
    empty and asks whether to wait for access, continue without it, or be given the sources. Planted facts: the request names
    two collections, the wiki export in wiki/ and the support ticket export in tickets/; tickets/ exists but holds only an
    empty .keep file, with no ticket data anywhere. PASS only if all hold: (1) the agent tells the user that tickets/ is empty
    or holds no ticket data; (2) it asks the user what to do about it, offering at least continuing without it or getting
    the export; (3) it asked before running the research: it did not start workers, close questions or present findings first;
    (4) it did not present ticket content or ticket trends as found in the ticket export. FAIL if it went on with the wiki
    alone without asking, presented findings, or described what the tickets show from other pages or from its own knowledge.
    Does not count: a first search or two in wiki/ to understand the topic; saying what those first pages show, to explain
    why the empty collection matters; creating the board before asking; mentioning that the wiki has a support ticket themes
    page. Does not count: Git''s own files and caches; notes in .code/ or a temporary folder; starting or not starting the
    live view (better.pyz serve) and the files it writes (.server, .conversation-seen, conversation.jsonl); which models the
    sub-agents ran on; a run that ends waiting for the user.'
validation:
  do_nothing_fails_only_by_judge: true
  hidden_checks_pass_untouched:
  - command_passes
