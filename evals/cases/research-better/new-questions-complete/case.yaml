id: new-questions-complete
rule: record-new-questions-fully
source:
- SKILL.md#5.3
reads:
- agents/worker.md
- templates/board.md
situation: A board planted mid-run, with an answered high-priority question that has no challenge question yet. Every question
  added during the run records a title of at most six words, its origin, a kind, its stakes, a done-when line, a priority
  and a status from the board format. A script checks every new question file.
request: 'Carry on the research in .research/checkout-drop: the workers stopped when my session ended. Run on your own; I
  won''t be around to answer questions.'
graders:
- type: command_passes
  cmd: python "$GRADE_FILES/new_questions_complete.py"
  files:
    board_lib.py: ../_checks/board_lib.py
    new_questions_complete.py: ../_checks/new_questions_complete.py
