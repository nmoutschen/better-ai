  content: |
    # Design: order history export

    Request: [architect.json](architect.json)
    Requirements: RQ1-RQ6 in [requirements.jsonl](requirements.jsonl)
    Diagrams: [design.json](design.json)

    ## Decisions summary

    - D1 Where the CSV is built. Drivers: RQ3, RQ4, RQ6.
      - Options: a cron job like send_emails (familiar); streaming the CSV from the request (not familiar).
      - Chosen: stream the CSV from GET /v1/account/orders.csv. 500 orders stream in well under the 10 s timeout (RQ3), no new job or table (RQ4), and a failure is an error the customer sees at once (RQ6).
      - Rejected: a cron job, because it adds a table, a job and a failure email for work that fits in one request.
      - Drawback: a very large history could hit the request timeout; the job stays the fallback.
