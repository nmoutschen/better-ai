id: decision-records-repo-format
rule: record-decisions-where-the-repo-keeps-them
source:
- modes/design.md
- templates/decision.md
reads:
- modes/design.md
- templates/decision.md
situation: >-
  The change folder docs/designs/2026-11-order-export/ holds a design whose review is settled: D2 was revised after
  finding F1, and the user's last note (n5) says "record the decisions and write the spec". docs/designs/README.md
  says decisions worth keeping go to docs/adr/, numbered after the last one, in the same format as the others;
  docs/adr/ holds 0001 and 0002 (number and title, Date, Status, Context, Decision, Consequences). The agent writes
  decisions.jsonl in the change folder and each decision as a new record in docs/adr/ from 0003, in the repo's format,
  holding drivers, the chosen option, the rejected alternatives with reasons and the main drawback. A script checks a
  new docs/adr/000[3-9]-*.md and that every decisions.jsonl record has rejected alternatives; the judge checks format
  and content.
request: I answered in the page. Carry on with docs/designs/2026-11-order-export.
graders:
- type: command_passes
  cmd: python "$GRADE_FILES/decisions_recorded.py"
  files:
    decisions_recorded.py: checks/decisions_recorded.py
- type: judge
  rubric: >-
    Rule: the agent records each decision worth keeping where and how the repository keeps decision records, with its
    drivers, the chosen option, the rejected alternatives with reasons and the main drawback. Planted facts:
    docs/designs/README.md says "Decisions worth keeping go to docs/adr/, numbered after the last one, in the same
    format as the others". docs/adr/0001-sqlite-for-orders.md and 0002-outbox-for-emails.md have a heading "# 000N.
    Title", then "Date:" and "Status:" lines, then sections Context, Decision and Consequences. design.md in
    docs/designs/2026-11-order-export/ holds D1 (build exports in a cron job; drivers RQ3, RQ4; rejected: the CSV built
    in the request, past the 10 s timeout, and a Celery and Redis queue, a new service against RQ4) and D2 as revised
    after finding F1 (serve exports through the API behind the session cookie for 7 days, files deleted after;
    drivers RQ2, RQ4; rejected: a public link on the static website, which exposes the data (F1), and the CSV attached
    to the email, over MailRelay's 5 MB limit and forwardable). The user's note n5 asks to record the decisions and
    write the spec. PASS only if all hold: (1) D2, and D1 unless the reply gives a reason it is not worth a record,
    each have a new file in docs/adr/ numbered after 0002 (0003, 0004 …); (2) each file follows the repo's format:
    the numbered title heading, Date and Status, and Context, Decision and Consequences sections; extra sections or
    lines, such as Drivers or Rejected alternatives, are fine; (3) each file states the drivers, the chosen option,
    each rejected alternative with its reason, and the main drawback, in whichever of those sections; (4) the D2 record
    states the revised choice, the download through the API with the session cookie, not the public link. FAIL if any
    of: a record is written only in the change folder or in .architect/; a record uses only the skill template's
    headings (Drivers, Chosen option, Rejected alternatives, Main drawback) without the repo's Date, Status, Context,
    Decision and Consequences; a file reuses 0001 or 0002 or overwrites them; a record leaves out its rejected
    alternatives or their reasons, or its drawback. Does not count: the spec and its checker; the Status word used,
    such as Accepted; the date; the file name after the number; decisions.jsonl fields beyond the script's check;
    Git's own files under .git/ and caches; notes in .code/ or a temporary folder; serving the live page and the files
    it writes (.server, .conversation-seen, conversation.jsonl entries written by architect.py); asking the user to
    confirm in the page; a run that ends waiting for the user.
