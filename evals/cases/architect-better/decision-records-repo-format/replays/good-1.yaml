- write: docs/adr/0003-build-exports-in-a-cron-job.md
  content: |
    # 0003. Build exports in a cron job

    Date: 2026-11-21
    Status: Accepted

    ## Context

    Drivers: RQ3 (500 orders within 5 minutes), RQ4 (existing VPS, no new paid service).

    ## Decision

    jobs/build_exports.py builds pending exports every minute. Rejected: building the CSV in the request (past the
    10 s timeout); Celery with Redis (a new service, against RQ4).

    ## Consequences

    - Exports wait up to a minute before the job picks them up.
- write: docs/adr/0004-serve-exports-through-the-api.md
  content: |
    # 0004. Serve exports through the API

    Date: 2026-11-21
    Status: Accepted

    ## Context

    Drivers: RQ2 (own data only, API standard rule 3), RQ4. Finding V1.

    ## Decision

    GET /v1/account/export/<token> serves the CSV to its owner, with the session cookie, for 7 days; the job deletes
    older files. Rejected: a public link on the static website (anyone with the link gets the data, forever); the CSV
    attached to the email (5 MB limit, emails get forwarded).

    ## Consequences

    - A download endpoint and file clean-up to maintain on the VPS.
