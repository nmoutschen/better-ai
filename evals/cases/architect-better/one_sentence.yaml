# One sentence per source of skills/architect-better: the core instruction of that SKILL.md section or skill file
# (draft, 2026-11-21, not yet reviewed by the user). Keys are the sources that cases name in `source`. The
# one-sentence condition appends the sentence for a case's first source to its request; cases whose first source has
# no entry are not run in that condition. The short-skill condition installs every sentence as the body of a short
# SKILL.md.
"SKILL.md#invocation": "You don't have to design right away: if I give you no change, ask me what to work on, and if the change adds no structure, tell me it needs no design."
"SKILL.md#1": "Before designing, read the repo's docs, designs, decision records, standards and the code the change touches, and if I propose a solution that works against what I need, tell me once with one alternative, then follow my decision."
"SKILL.md#ask-the-user": "Ask me in one message about every gap that changes what the system stores, who can reach what, what it costs to run, what users see when it fails or what is hard to undo, with each option's outcome; ask me about decisions with your recommendation and its drawback; tell me when a requirement conflicts with another, a recorded decision or a repo standard instead of designing your own version; and mark every other gap as guessed."
"SKILL.md#4": "When you hand back, link the design, diagrams, decision records and spec, map each requirement to the part that meets it, list guessed requirements, open and unconfirmed review findings, and never present the reviews or the design meeting its requirements as my approval."
"modes/design.md": "Keep the design in the repo's design location (or .architect/<change>/), save my request word for word, draw the system as it is from the code and have me confirm it, agree the requirements with their sources and quality attributes as measurable scenarios, design by comparing options including an unfamiliar one, keep Before's part ids in After, list every perspective with whether it applies, review only after I approve with one fresh sub-agent per perspective and findings on diagram parts, then record decisions where the repo keeps them and extract an EARS spec that a separate sub-agent checks."
"modes/audit.md": "When I ask you to review a design or a system against its design, change nothing: check the code against the design, review each applicable perspective with a fresh sub-agent, confirm findings with evidence, and report them by perspective with the diagram part, consequence and proposed action."
"agents/security.md": "When you review a design for security, rank its assets, trust boundaries and flows by harm, apply STRIDE to the riskiest ones, and check that every boundary names who authenticates and authorizes the caller, with findings attached to the box, arrow or flow step."
"agents/data-and-privacy.md": "When you review a design for data and privacy, trace each class of personal data from collection to deletion, name who can see each copy and where it leaves the system, and attach each finding to the box, arrow or flow step."
"agents/failure-handling.md": "When you review a design for failure handling, walk each critical flow with a dependency that is slow, rejects work or stops replying, and check deadlines, uncertain writes, retries, capacity and recovery, with findings attached to the box, arrow or flow step."
"agents/observability.md": "When you review a design for observability, check that a signal detects when callers are not served, that the alert reaches an owner, and that one request can be followed across every part, with findings attached to the box, arrow or flow step."
"agents/agent-experience.md": "When you review a design for agent experience, walk each scenario as the agent from its entry point to the state it leaves, and check who enforces its writes, how it retries safely, finds its actions, reads errors and long results, and gets the state it needs, with findings attached to the box, arrow or flow step."
"agents/api-standards.md": "When you review a design's interfaces, check what each promises its clients, whether each change keeps old clients, events and files working, and how failures reach the client, with findings attached to the box, arrow or flow step."
"agents/repo-standards.md": "When you review a design against a repo standard, list the items that apply, check each one or its stated exception, and quote the passage in each finding, attached to the box, arrow or flow step."
"agents/spec-checker.md": "When you check a spec, check that every MUST in the design, decisions and request has an EARS requirement with concrete values, and that each requirement's source says what it claims."
