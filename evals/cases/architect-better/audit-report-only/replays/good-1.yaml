    # Audit: order export design

    ## Data and privacy
    - box:exportfiles + step:export/x8: public CSV, no login, never deleted. Breaks RQ2, API standard rule 3. Proposed: download through the API behind the cookie, delete after 7 days.

    ## Observability
    - box:exportjob: failure before the outbox row is silent (RQ6). Proposed: mark failed and enqueue the failure email in one try/finally.
