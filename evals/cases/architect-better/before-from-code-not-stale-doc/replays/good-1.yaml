reply: 'Before is drawn in docs/designs/2026-11-shipping-email/ from the code: the API writes an outbox row with the
  order, and the send_emails job sends it through MailRelay. docs/architecture.md says the API calls MailRelay directly;
  the code and ADR 0002 say otherwise, so I followed the code. The cron schedule is not in the repo, I took it from the
  job''s docstring. Please confirm or correct Before in the page.'
