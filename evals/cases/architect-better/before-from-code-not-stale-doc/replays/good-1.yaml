     "by": "architect",
     "request": {
      "text": "Customers keep emailing us to ask whether their books have left. When we post a parcel we set the order's status to 'posted' by hand in shop.db, and we'll keep doing that. Design a shipping email for it. Once an order's status is 'posted', the customer who placed it gets one email saying it's on its way, without a tracking number. Store only what is needed to send it once. If it cannot be sent, we see that in the job's log and the customer simply doesn't get it. No new paid service.\nDecide anything else yourself and list it as an assumption.",
      "from": {
       "type": "chat"
      }
