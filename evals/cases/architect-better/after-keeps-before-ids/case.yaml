id: after-keeps-before-ids
rule: preserve-part-identity
source:
- modes/design.md
reads:
- modes/design.md
- scripts/example/README.md
situation: 'Stage b-requirements: design.json in docs/designs/2026-11-order-export/ holds the confirmed Before (7 nodes,
  edges e1-e6, group vps, flow order with steps s1-s6); requirements are confirmed and n2 says "design it". The agent
  adds After to the same design.json: every planted node, edge, group, flow and step keeps its id (a removed part stays,
  marked "in": ["before"]), and every part it adds is marked "in": ["after"] (a step of a new flow marked after may omit
  it). A script compares the planted design.json with the final one and fails when nothing was added; these are exact
  facts, so there is no judge.'
request: I confirmed the requirements in the page. Please continue the design in docs/designs/2026-11-order-export.
