reply: >-
  Two things stop people from booking. (1) Keyboard and screen reader users cannot book at all: "Continue" is a
  div with a click handler, so Tab skips it and Enter does nothing; they fill the form and have no way to send it.
  Fix: make it a <button type="submit"> and handle the form's submit event. (2) If the phone number is missing or
  mistyped, pressing Continue shows "Invalid input" in a red banner at the top of the page, above the photo, out
  of view on a phone; the guest does not learn which field is wrong. Fix: show the message under the field it is
  about, saying what to enter ("Enter a mobile number, such as 0470 12 34 56"), and move focus to the field.
  Smaller: the date field has no label once you start typing, and the photo's alt text is "image". The full list
  with proposed fixes is in .design/booking-review/findings.md. I changed nothing; say which fixes you want.
