  content: |
    # Booking page review

    Scenario: a guest books a table for a date and time.

    1. Pressing Continue (keyboard): Continue is a `<div onclick>`. Tab moves from "Anything we should know?"
       past it; Enter in a field does nothing because the form returns false on submit. A keyboard or screen
       reader user cannot send the booking. Fix: `<button type="submit" class="button">Continue</button>` and
       handle the form's submit event in booking.js.
    2. After Continue with no phone number: "Invalid input" appears in the banner at the top of the page, not next
       to the phone field, and does not say which field is wrong. On a phone it is scrolled out of view. Fix: an
       error under each field that is wrong, saying what to enter, and focus on the first one.
    3. Choosing a date: the date field has a placeholder and no label; the placeholder disappears once typing
       starts. Fix: a "Date" label like the other fields, with the format as a hint.
    4. The photo has alt="image". Fix: describe it ("The dining room at Osteria Lume") or mark it decorative.
    5. Structure: "Booking history by API version" repeats My bookings; no guest task needs it. Fix: remove it
       from the nav.
