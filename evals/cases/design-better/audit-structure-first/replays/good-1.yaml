  content: |
    # Booking site audit

    Guest scenarios: book a table; see or change an upcoming booking.

    ## Structure

    1. history.html, "Booking history by API version", repeats account.html: the same four bookings, grouped by
       API v1 and v2. Neither scenario needs it. Proposal: remove it from the guests' nav.

    ## Booking page

    2. Continue is a `<div onclick>`: keyboard and screen reader users cannot send the form.
    3. A missing phone number shows "Invalid input" in the top banner, away from the field.
    4. The date input has no label.
    5. The photo has alt="image".
