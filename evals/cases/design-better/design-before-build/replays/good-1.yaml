  content: |
    # Design: shift swaps, direction B

    Built from `.design/shift-swap/brief.md` and the user's choice of B (answers.jsonl: B, with the note optional).

    ## Pages and parts

    One page, index.html. In order: a status line for results, "Waiting for your approval" (store manager only),
    "Your shifts this week", "Shifts you can take", "Store rota" (store manager only).

    ## Requirements per scenario

    1. A barista offers a shift. Signed in as Lena Vos, she selects "Offer this shift" on her Saturday 12 December
       07:00 to 15:00 card, may type a note, and selects "Offer shift". Done when that card shows "Offered, waiting for a
       colleague", and Tom Peeters, signed in, sees the shift under "Shifts you can take" with Lena's note.
    2. A manager approves a swap. Signed in as Ruben Claes, he sees Sam Okafor's Sunday 13 December 08:00 to 16:00 shift
       taken by Tom Peeters under "Waiting for your approval", with Sam's note, and selects "Approve swap". Done when the
       store rota shows "Tom Peeters: Sunday 13 December, 08:00 to 16:00" and the approval list says no swaps are waiting.

    ## Interface requirements for the code

    - Every action is a native `<button>` whose text names the action ("Offer this shift", "Offer shift", "Take this
      shift", "Approve swap", "Decline").
    - The note field has a visible label tied to it with `for`/`id`; it is optional and says so.
    - Every action works by keyboard in the order of the task; opening the offer form moves focus to the note field.
    - Focus stays visible (the `:focus-visible` outline in styles.css).
    - The result of each action is written to a `role="status"` line, so it is announced.
    - Only the tokens in tokens.css; no new colours or sizes.

    ## States

    - No shifts: "You have no shifts this week." No offers: "No colleague is offering a shift right now."
      Nothing to approve: "No swaps are waiting for you."
    - An offered shift can be taken back until a colleague takes it.
- write: app.js
  content: |
    // Kade Street shifts: shows the signed-in person's shifts, and the whole rota for managers.
    // Data comes from shifts.json, exported nightly from the scheduling system.

    const state = { data: null, personId: "lena", openOffer: null };

    const dayFormat = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long" });

    function person(id) {
      return state.data.staff.find((p) => p.id === id);
    }

    function shiftById(id) {
      return state.data.shifts.find((s) => s.id === id);
    }

    function swapFor(shift) {
      return state.data.swaps.find((w) => w.shiftId === shift.id && w.status !== "declined");
    }

    function describeShift(shift) {
      const date = dayFormat.format(new Date(shift.date + "T00:00:00"));
      return { when: `${date}, ${shift.start} to ${shift.end}`, where: `${shift.station}, Kade Street` };
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function button(text, onClick, secondary) {
      const node = el("button", secondary ? "secondary" : "", text);
      node.type = "button";
      node.addEventListener("click", onClick);
      return node;
    }

    function shiftItem(shift, showName) {
      const item = el("li", "shift");
      item.dataset.shiftId = shift.id;
      const text = describeShift(shift);
      item.append(
        el("div", "when", showName ? `${person(shift.staffId).name}: ${text.when}` : text.when),
        el("div", "where", text.where),
      );
      return item;
    }

    function offerForm(shift) {
      const form = el("form", "offer-form");
      const noteId = `note-${shift.id}`;
      const label = el("label", "", "Why, for your colleagues (optional)");
      label.htmlFor = noteId;
      const note = el("input");
      note.id = noteId;
      const send = el("button", "", "Offer shift");
      send.type = "submit";
      form.append(label, note, send, button("Cancel", () => { state.openOffer = null; render(); }, true));
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        state.data.swaps.push({ id: `w-${Date.now()}`, shiftId: shift.id, fromStaffId: shift.staffId, note: note.value, status: "offered" });
        state.openOffer = null;
        render(`Your ${describeShift(shift).when} shift is offered to your colleagues.`);
      });
      setTimeout(() => note.focus());
      return form;
    }

    function myShiftItem(shift) {
      const item = shiftItem(shift, false);
      const swap = swapFor(shift);
      if (swap && swap.status === "offered") {
        item.append(el("p", "status", "Offered, waiting for a colleague"),
          button("Take it back", () => { swap.status = "declined"; render("Your shift is no longer offered."); }, true));
      } else if (swap && swap.status === "taken") {
        item.append(el("p", "status", `Taken by ${person(swap.toStaffId).name}, waiting for the manager`));
      } else if (state.openOffer === shift.id) {
        item.append(offerForm(shift));
      } else {
        item.append(button("Offer this shift", () => { state.openOffer = shift.id; render(); }));
      }
      return item;
    }

    function takeableItem(swap) {
      const shift = shiftById(swap.shiftId);
      const item = shiftItem(shift, false);
      const from = person(swap.fromStaffId).name;
      item.append(el("p", "status", swap.note ? `Offered by ${from}: "${swap.note}"` : `Offered by ${from}`),
        button("Take this shift", () => { swap.toStaffId = state.personId; swap.status = "taken"; render("You took the shift. The manager will approve it."); }));
      return item;
    }

    function approvalItem(swap) {
      const shift = shiftById(swap.shiftId);
      const item = shiftItem(shift, false);
      item.append(el("p", "status", `${person(swap.fromStaffId).name} gives it to ${person(swap.toStaffId).name}.` + (swap.note ? ` Note: "${swap.note}"` : "")),
        button("Approve swap", () => { swap.status = "approved"; shift.staffId = swap.toStaffId; render("Swap approved. The rota is updated."); }),
        button("Decline", () => { swap.status = "declined"; render("Swap declined."); }, true));
      return item;
    }

    function fill(list, items, emptyText) {
      list.replaceChildren(...items);
      if (items.length === 0) list.append(el("li", "empty", emptyText));
    }

    function render(message) {
      const me = person(state.personId);
      const mine = state.data.shifts.filter((s) => s.staffId === me.id);
      fill(document.getElementById("my-shifts"), mine.map(myShiftItem), "You have no shifts this week.");

      const takeable = state.data.swaps.filter((w) => w.status === "offered" && w.fromStaffId !== me.id);
      fill(document.getElementById("takeable"), takeable.map(takeableItem), "No colleague is offering a shift right now.");

      const isManager = me.role === "Store manager";
      document.getElementById("approval-section").hidden = !isManager;
      document.getElementById("rota-section").hidden = !isManager;
      if (isManager) {
        const waiting = state.data.swaps.filter((w) => w.status === "taken");
        fill(document.getElementById("approvals"), waiting.map(approvalItem), "No swaps are waiting for you.");
        document.getElementById("rota").replaceChildren(...state.data.shifts.map((s) => shiftItem(s, true)));
      }
      document.getElementById("announce").textContent = message || "";
    }

    function fillPeople() {
      const select = document.getElementById("person");
      for (const p of state.data.staff) {
        const option = el("option", "", `${p.name} (${p.role})`);
        option.value = p.id;
        select.append(option);
      }
      select.value = state.personId;
      select.addEventListener("change", () => {
        state.personId = select.value;
        state.openOffer = null;
        render();
      });
    }

    fetch("shifts.json")
      .then((response) => response.json())
      .then((data) => {
        state.data = data;
        fillPeople();
        render();
      });
