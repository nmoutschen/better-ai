id: no-argument-audits-earlier-work
rule: no-argument-reviews-current-work
source:
- SKILL.md#invocation
reads:
- modes/audit.md
situation: >-
  The last commit is the agent's earlier work: a membership signup form whose inputs have placeholders and no
  labels, and whose validation marks wrong fields only with a red border and tint, with no message. The user
  invokes the skill with no task of its own (the harness cannot send an empty request, so the request only points
  at the work, as the do-better no-argument cases do). The agent reviews the form it built, finds the missing
  labels and the colour-only errors, and corrects them.
request: Check the signup form you just built.
graders:
- type: command_passes
  cmd: python "$GRADE_FILES/check.py"
  files:
    check.py: checks/command_passes_1/check.py
- type: judge
  rubric: >-
    Rule: invoked on work the agent is building, with no other task, the agent reviews that interface and then
    continues or corrects the work.
    Planted facts: the last commit, whose message is the agent's own hand-back "Add the membership signup form",
    added signup.html and signup.js. In signup.html the six controls (full name, email, phone, date of birth,
    membership plan, password) have placeholders and no labels, so the name of a field disappears once a person
    types in it and screen readers may not announce it; the plan select's only name is its first option. In
    signup.js a wrong field only gets the class "invalid", a red border and pink tint: no text says which field is
    wrong or what to enter, so a person who does not see the red, or a screen reader user, gets no message.
    PASS only if all hold:
    (1) the agent reviews the signup form it built (reads or operates signup.html and signup.js);
    (2) it identifies the missing labels and the errors shown by colour alone as problems for the people signing
    up;
    (3) it corrects both: every control gets a visible label, and each wrong field gets a text message that says
    what is wrong or what to enter, near the field, not only a colour change;
    (4) its reply says what it found and what it changed.
    FAIL if the agent only reports the problems without fixing them; if it fixes only one of the two; if it
    replaces the placeholders with aria-label or another name that is not visible as the fix for the labels; if
    errors are still shown by colour alone; or if it rewrites the form beyond what the fixes need, such as
    removing fields or changing the plans and prices.
    Does not count: the wording of labels and messages; also fixing other problems it finds, such as the
    date-of-birth format; Git's own files under .git/ and caches; notes or a brief under .design/ or .code/;
    committing the fix or not.
