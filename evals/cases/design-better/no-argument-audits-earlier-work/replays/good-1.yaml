- write: signup.js
  content: |
    // Membership sign-up: shows a message under each invalid field, then the welcome message.

    const rules = {
      "full-name": (value) => value.trim().length >= 2,
      email: (value) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value),
      phone: (value) => /^\+?[\d\s]{9,15}$/.test(value),
      "birth-date": (value) => /^\d{2}\/\d{2}\/\d{4}$/.test(value),
      plan: (value) => value !== "",
      password: (value) => value.length >= 8,
    };

    document.getElementById("signup").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      let firstInvalid = null;
      for (const [name, check] of Object.entries(rules)) {
        const field = form.elements[name];
        const ok = check(field.value);
        field.classList.toggle("invalid", !ok);
        field.setAttribute("aria-invalid", String(!ok));
        document.getElementById(`${name}-error`).hidden = ok;
        if (!ok && !firstInvalid) firstInvalid = field;
      }
      if (firstInvalid) {
        firstInvalid.focus();
        return;
      }
      form.hidden = true;
      document.getElementById("done").hidden = false;
    });
