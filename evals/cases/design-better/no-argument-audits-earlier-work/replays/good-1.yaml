reply: >-
  I reviewed the signup form I built and found two problems. (1) The fields had placeholders and no labels: once
  you type, the field's name is gone, and the plan list was named only by its first option. Each field now has a
  visible label above it. (2) A wrong field only turned red, with no text, so anyone who does not see the colour,
  and screen reader users, were not told what to fix. Each wrong field now shows a message under it saying what
  to enter, linked with aria-describedby, and focus moves to the first wrong field.
