    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Become a member · Rivergate Climbing</title>
      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
      <header class="top">
        <a class="brand" href="index.html">Rivergate Climbing</a>
      </header>
      <main>
        <h1>Become a member</h1>
        <p>Climb as often as you like for €49 a month, or €39 with a student card. Cancel any month.</p>

        <form id="signup" class="signup" novalidate>
          <label for="full-name">Full name</label>
          <input id="full-name" name="full-name" type="text" autocomplete="name" aria-describedby="full-name-error">
          <p class="error" id="full-name-error" hidden>Enter your full name.</p>

          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
          <p class="error" id="email-error" hidden>Enter an email address, such as name@example.com.</p>

          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-error">
          <p class="error" id="phone-error" hidden>Enter a phone number of 9 to 15 digits.</p>

          <label for="birth-date">Date of birth</label>
          <input id="birth-date" name="birth-date" type="text" placeholder="dd/mm/yyyy" aria-describedby="birth-date-error">
          <p class="error" id="birth-date-error" hidden>Enter your date of birth as dd/mm/yyyy.</p>

          <label for="plan">Membership</label>
          <select id="plan" name="plan" aria-describedby="plan-error">
            <option value="">Choose a membership</option>
            <option value="monthly">Monthly, €49</option>
            <option value="student">Student, €39</option>
          </select>
          <p class="error" id="plan-error" hidden>Choose a membership.</p>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-error">
          <p class="error" id="password-error" hidden>Use at least 8 characters.</p>

          <button type="submit">Join Rivergate</button>
        </form>

        <div id="done" class="done" hidden>
          <h2>Welcome to Rivergate</h2>
          <p>We sent a confirmation to your email. Bring a photo ID to your first visit for the safety intro.</p>
        </div>
