<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Become a member · Rivergate Climbing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">Rivergate Climbing</a>
  </header>
  <main>
    <h1>Become a member</h1>
    <p>Climb as often as you like for €49 a month, or €39 with a student card. Cancel any month.</p>

    <form id="signup" class="signup" novalidate>
      <input id="full-name" name="full-name" type="text" placeholder="Full name" autocomplete="name">
      <input id="email" name="email" type="email" placeholder="Email" autocomplete="email">
      <input id="phone" name="phone" type="tel" placeholder="Phone" autocomplete="tel">
      <input id="birth-date" name="birth-date" type="text" placeholder="Date of birth (dd/mm/yyyy)">
      <select id="plan" name="plan">
        <option value="">Membership</option>
        <option value="monthly">Monthly, €49</option>
        <option value="student">Student, €39</option>
      </select>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="new-password">
      <button type="submit">Join Rivergate</button>
    </form>

    <div id="done" class="done" hidden>
      <h2>Welcome to Rivergate</h2>
      <p>We sent a confirmation to your email. Bring a photo ID to your first visit for the safety intro.</p>
    </div>
  </main>
  <script src="signup.js"></script>
</body>
</html>
