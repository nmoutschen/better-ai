# One sentence per source of skills/design-better: the core instruction of that SKILL.md section or skill file
# (modes design, audit and language, 2026-11-20). Keys are the sources that cases name in `source`. The
# one-sentence condition appends the sentence for a case's first source to its request; cases whose first source
# has no entry are not run in that condition. The short-skill condition installs every sentence as the body of a
# short SKILL.md.
"SKILL.md#invocation": "For a small change inside one screen, such as a clearer label, just make it by your design rules, without a brief, options or questions; without a task, review the interface you are building and then continue or correct it."
"SKILL.md#1": "Read the existing interface, its design language and the project's files before deciding anything, and never change a colour, type size, spacing value or component the design language defines as a fix: tell me the conflict with its effect and one alternative, and wait for my decision."
"SKILL.md#2": "Write a short brief: who uses the interface and in what conditions, a few scenarios from start to an end they can observe with real data, and for each page or part the scenario it serves, asking me whether parts that serve none should merge or go."
"SKILL.md#3": "Ask me at most about three questions, all in one message, each answerable in a few words, about what only I know and what changes the design, such as what happens to people's data or money, and state every other gap as an assumption."
"SKILL.md#6": "When you hand back, say which scenarios were walked in the built interface and how, which decisions are mine, and never claim that people can use it because the scenarios can be completed; offer a short test with three to five people when the main flow is new."
"SKILL.md#show-versions-on-one-page": "Show versions side by side on one rendered page, at every screen size the brief names, the size most people use first."
"SKILL.md#design-rules": "Give each colour one meaning across a page, never use colour as the only signal, keep text contrast at least 4.5 to 1, label every field visibly with the label tied to it, put errors next to their field, and make every action work by keyboard with native controls whose names say what they do."
"modes/design.md": "For a new interface or a change to its screens, layout or flow, ask for my own direction first, show two or three rough directions that differ in structure on one page, write a design with one requirement per scenario before any code changes, then after building have a separate sub-agent walk every scenario in the rendered interface and fix what it finds."
"modes/audit.md": "When I ask for a review of an interface or a design language, change nothing: have a separate sub-agent review it, confirm each finding at the step where a person is stopped, and report pages that should merge or go first, then the rest by their effect on the people using it."
"modes/language.md": "To create a design language, first ask me what the interfaces must express in my own words and which interfaces I like and dislike, without suggesting qualities, then propose directions that depart from your default, and after building check the code for values the document does not name."
"agents/reviewer.md": "When you review an interface, walk each scenario by operating the rendered page with a pointer, then the keyboard, then on a small screen, check that every name, label, heading and alt text says what the thing is or does, never role-play a person with a disability or an age, and report only findings tied to a step where a person is stopped."
