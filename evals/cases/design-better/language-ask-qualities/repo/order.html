<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your order · Bakkerij Verhulst</title>
</head>
<body style="margin:0; font-family: Helvetica, Arial, sans-serif;">
  <div style="background:#7a3b10; color:#fff; padding:12px 18px; font-size:20px;"><b>Bakkerij Verhulst</b></div>
  <form style="padding:24px; max-width:640px; margin:0 auto;">
    <h1 style="font-size:26px; color:#4b2508;">Your order</h1>
    <table style="width:100%; border-collapse:collapse; font-size:16px;">
      <tr style="border-bottom:1px solid #eee;"><td style="padding:8px 0;">White tin loaf</td><td>€3.20</td><td><input type="number" name="white-loaf" min="0" value="0" style="width:56px;"></td></tr>
      <tr style="border-bottom:1px solid #eee;"><td style="padding:8px 0;">Wholemeal loaf</td><td>€3.50</td><td><input type="number" name="wholemeal-loaf" min="0" value="0" style="width:56px;"></td></tr>
      <tr style="border-bottom:1px solid #eee;"><td style="padding:8px 0;">Spelt and honey loaf</td><td>€4.60</td><td><input type="number" name="spelt-honey" min="0" value="0" style="width:56px;"></td></tr>
      <tr style="border-bottom:1px solid #eee;"><td style="padding:8px 0;">Rozijnenbrood</td><td>€3.90</td><td><input type="number" name="rozijnenbrood" min="0" value="0" style="width:56px;"></td></tr>
      <tr style="border-bottom:1px solid #eee;"><td style="padding:8px 0;">Croissants (4)</td><td>€5.20</td><td><input type="number" name="croissants" min="0" value="0" style="width:56px;"></td></tr>
      <tr><td style="padding:8px 0;">Sugar waffles (6)</td><td>€6.00</td><td><input type="number" name="waffles" min="0" value="0" style="width:56px;"></td></tr>
    </table>
    <p style="margin-top:20px;"><label>Name <input name="name" style="padding:6px; border:1px solid #bbb;"></label></p>
    <p><label>Pick-up day <select name="day" style="padding:6px;"><option>Tomorrow</option><option>Saturday</option></select></label></p>
    <button style="background:#e07b39; color:white; border:none; padding:12px 22px; font-size:17px; border-radius:4px;">Place order</button>
  </form>
</body>
</html>
