<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direction A: swap board</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <header><h1>Kade Street shifts</h1><nav><a href="#">Your shifts</a> <a href="#">Swap board</a></nav></header>
  <main>
    <h2>Swap board</h2>
    <form>
      <label for="a-shift">Shift to give away</label>
      <select id="a-shift"><option>Saturday 12 December, 07:00 to 15:00, Bar</option></select>
      <label for="a-note">Note</label>
      <input id="a-note" value="Family visit">
      <button type="button">Post to the swap board</button>
    </form>
    <h2>Posted swaps</h2>
    <ul class="shift-list">
      <li class="shift"><div class="when">Sam Okafor: Sunday 13 December, 08:00 to 16:00</div><div class="where">Bar. Taken by Tom Peeters, waiting for Ruben</div></li>
    </ul>
  </main>
</body>
</html>
