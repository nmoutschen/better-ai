    \nURL = \"http://127.0.0.1:8123/\"\nSATURDAY = \"Saturday 12 December, 07:00 to 15:00\"\n\n\ndef open_as(page, who):\n\
    \    page.goto(URL)\n    page.wait_for_selector(\"#my-shifts li\")\n    page.select_option(\"#person\", who)\n\n\ndef\
    \ tab_to(page, text, nth=1):\n    seen = 0\n    for _ in range(60):\n        page.keyboard.press(\"Tab\")\n        if\
    \ page.evaluate(\"document.activeElement.textContent.trim()\") == text:\n            seen += 1\n            if seen ==\
    \ nth:\n                return\n    raise AssertionError(f\"could not reach '{text}' by keyboard\")\n\n\ndef offer_by_pointer(page):\n\
    \    open_as(page, \"lena\")\n    card = page.locator(\"#my-shifts li\", has_text=SATURDAY)\n    card.get_by_role(\"button\"\
    , name=\"Offer this shift\").click()\n    card.get_by_label(\"Why, for your colleagues (optional)\").fill(\"Family visit\"\
    )\n    card.get_by_role(\"button\", name=\"Offer shift\").click()\n    assert \"Offered, waiting for a colleague\" in\
    \ page.locator(\"#my-shifts li\", has_text=SATURDAY).inner_text()\n    page.select_option(\"#person\", \"tom\")\n    assert\
    \ SATURDAY in page.locator(\"#takeable\").inner_text()\n\n\ndef offer_by_keyboard(page):\n    open_as(page, \"lena\")\n\
    \    page.focus(\"#person\")\n    tab_to(page, \"Offer this shift\", nth=3)\n    page.keyboard.press(\"Enter\")\n    page.wait_for_function(\"\
    document.activeElement && document.activeElement.tagName === 'INPUT'\")\n    page.keyboard.type(\"Family visit\")\n  \
    \  page.keyboard.press(\"Enter\")\n    assert \"Offered, waiting for a colleague\" in page.locator(\"#my-shifts li\",\
    \ has_text=SATURDAY).inner_text()\n\n\ndef approve(page, keyboard):\n    open_as(page, \"ruben\")\n    if keyboard:\n\
    \        page.focus(\"#person\")\n        tab_to(page, \"Approve swap\")\n        page.keyboard.press(\"Enter\")\n   \
    \ else:\n        page.get_by_role(\"button\", name=\"Approve swap\").click()\n    assert \"Tom Peeters: Sunday 13 December,\
    \ 08:00 to 16:00\" in page.locator(\"#rota\").inner_text()\n    assert \"No swaps are waiting for you\" in page.locator(\"\
    #approvals\").inner_text()\n\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch()\n    for width, height\
    \ in ((1280, 800), (360, 740)):\n        page = browser.new_page(viewport={\"width\": width, \"height\": height})\n  \
    \      offer_by_pointer(page)\n        print(f\"{width}px offer a shift, pointer: done\")\n        offer_by_keyboard(page)\n\
    \        print(f\"{width}px offer a shift, keyboard: done\")\n    browser.close()\nEOF\nstatus=$?\nkill $server\nexit\
    \ $status\n"
