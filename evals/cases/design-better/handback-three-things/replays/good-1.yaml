reply: |
  Lena can now offer a shift from its card in "Your shifts this week", with an optional note; colleagues see it under "Shifts you can take". The manager approval is not built yet, as you asked.

  I walked "A barista offers a shift" in headless Chromium, by mouse and by keyboard only, at 1280 and 360 px wide: each time Lena's Saturday 12 December card ended as "Offered, waiting for a colleague" and Tom saw it.

  That shows the flow can be completed and that my checks pass. It does not show that baristas will find it between customers: only people trying it can show that. The offer flow is new, so I suggest a short test: watch three to five baristas, on their own phones, try "you can't work Saturday morning; hand the shift to a colleague" without help, and note where each one hesitates. It finds the common problems, not all of them.
