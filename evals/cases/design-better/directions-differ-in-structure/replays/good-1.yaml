- write: .design/next-ticket/C.html
  content: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8"><title>C: lanes by priority</title>
    <link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../styles.css"></head>
