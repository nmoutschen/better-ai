- write: .design/next-ticket/index.html
  content: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8"><title>Pick the next ticket: three directions</title>
    <style>.row{display:flex;gap:16px}.row figure{flex:1;margin:0}.row iframe{width:100%;height:720px;border:1px solid #ccc}</style></head>
    <body><h1>Which direction fits how agents pick their next ticket?</h1>
    <div class="row">
    <figure><iframe src="A.html" title="A"></iframe><figcaption>A. Queue by deadline</figcaption></figure>
    <figure><iframe src="B.html" title="B"></iframe><figcaption>B. One next ticket</figcaption></figure>
    <figure><iframe src="C.html" title="C"></iframe><figcaption>C. Lanes by priority</figcaption></figure>
    </div></body></html>
