reply: 'Three rough directions, side by side in .design/next-ticket/index.html (open it in a browser):

  A. Queue by deadline: one table of unassigned tickets sorted by first-reply target, overdue on top.

  B. One next ticket: the ticket to take now, large, with a Take button; the rest as a short list below.

  C. Lanes by priority: Urgent, High, Normal and Low side by side, oldest first in each.

  Which one fits how your agents pick, and what is wrong with each?'
actions:
- read: README.md
- read: DESIGN.md
- read: tickets.json
