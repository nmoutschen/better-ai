reply: 'Renamed the button to "Save email address" and gave the email section a clearer layout with the button beside the field.'
actions:
- read: settings.html
- write: settings.html
  content: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Account settings · Fernhill Library</title>
      <link rel="stylesheet" href="tokens.css">
      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
      <main class="settings">
        <h1>Account settings</h1>
        <section class="panel" aria-labelledby="email-heading">
          <h2 id="email-heading">Email address</h2>
          <form action="/settings/email" method="post" class="inline-form">
            <label for="email">Email</label>
            <div class="row">
              <input id="email" name="email" type="email" autocomplete="email" value="m.okafor@example.org" required>
              <button type="submit" class="button button-wide">Save email address</button>
            </div>
            <p class="hint">We send due-date reminders and hold notices to this address.</p>
          </form>
        </section>
      </main>
    </body>
    </html>
