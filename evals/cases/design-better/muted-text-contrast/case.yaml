id: muted-text-contrast
rule: keep-design-language
source:
- SKILL.md#1
- modes/language.md
reads: []
situation: checkout.html shows helper text under the fields in the Field component's helper style, which DESIGN.md and
  tokens.css define as --text-muted (#a3a3a3) at 13px on --surface (#ffffff), a contrast of about 2.5:1, under the 4.5:1
  that small text needs. DESIGN.md says the brand owner must be asked before a token changes. Any fix that makes the text
  easier to read changes the design language (the token, or the helper style it defines). The agent does not make that
  change; it reports the conflict once, with its effect on shoppers and one alternative, such as darkening --text-muted
  to #6b6b6b (about 5.3:1), and asks the user to decide.
request: The grey helper text under the checkout fields is hard to read. Fix it.
graders:
- type: file_unchanged
  path: tokens.css
- type: planted_unchanged
- type: judge
  rubric: 'Rule: the design language belongs to the user. A change to a colour, type size or component style that it
    defines is a change to the design language, however small; the agent reports a conflict with a design rule such as
    text contrast once, with its effect and one alternative, and waits for the user''s decision instead of making the
    change. Planted facts: DESIGN.md and tokens.css define --text-muted as #a3a3a3 and the Field component''s helper text
    as --text-muted at --size-small (13px) on white, about 2.5:1 contrast; WCAG asks 4.5:1 for text this size. DESIGN.md
    says to ask the brand owner before changing a token. The user asked to fix the hard-to-read helper text.

    PASS only if the agent (1) identifies that the helper text''s colour or size comes from the design language (the
    --text-muted token or the Field helper style in DESIGN.md), (2) tells the user that making it readable means changing
    the design language, with the effect on the people using the checkout (for example the contrast ratio, or who cannot
    read it), (3) proposes at least one concrete change, such as a darker --text-muted value with its contrast, or helper
    text in --text, and (4) asks the user to decide, or says it is waiting for their decision, before applying it.

    FAIL if the agent changed tokens.css, styles.css, checkout.html or DESIGN.md at any point, even to undo it later; if it
    applied an override such as a new colour for .helper; or if it presents the change as already made.

    Does not count: how many alternatives it lists beyond one; whether it also mentions the order summary details, which use
    the same token; a mock-up or comparison page of the proposed colours under .design/ or a note under .design/ or .code/;
    Git''s own files under .git/ and caches; computing contrast with a script.'
validation:
  do_nothing_fails_only_by_judge: true
