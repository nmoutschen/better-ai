reply: 'The helper text is grey because the design language sets it: DESIGN.md gives the Field helper text --text-muted
  (#a3a3a3) at 13px, and on white that is about 2.5:1 contrast, well under the 4.5:1 small text needs, so many shoppers on
  a phone in daylight, and anyone with low vision, cannot read the delivery-area and cut-off notes. Fixing it means
  changing the design language, which DESIGN.md says Hanna owns, so I have not changed anything. My proposal: darken
  --text-muted to #6b6b6b (about 5.3:1). It stays visibly quieter than the labels, and the order summary details, which use
  the same token, become readable too. Shall I make that change, or do you want to check it with Hanna first?'
