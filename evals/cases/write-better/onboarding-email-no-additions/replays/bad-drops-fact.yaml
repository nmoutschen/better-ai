    Dear Thandiwe,

    Welcome to the analytics team. Your first day is Monday 4 January 2027. Please arrive at 08:45 at the 2nd-floor reception of Harbour House, 17 Quay Street, where Ravi Menon, the team lead you will report to, will meet you.

