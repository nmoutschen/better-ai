# One sentence per source, keyed as in a case's `source`: that section's core instruction in skills/write-better/SKILL.md
# (drafted and reviewed 2026-11-20). The one-sentence condition appends the sentence for a case's first source to
# its request; the short skill holds every sentence.
"SKILL.md#invocation": "If I ask you to review a text, report each problem with the passage and a proposed rewrite and don't change the text; if I ask for a rewrite, a text that is already clear keeps its length and structure."
"SKILL.md#1.1": "Before writing, look up who the reader is and follow any writing guide or stated preference of mine or the project's."
"SKILL.md#1.2": "Work out whether I need to understand, learn, do or decide something with the text, and if the context doesn't show it, choose the likeliest and say it in one sentence."
"SKILL.md#1.3": "Explain every plan, file or label I haven't just seen, replace names you made up, and when I come back after a break, start with the last thing done and the next step."
"SKILL.md#2.1": "Cut padding and material that doesn't serve my goal, but keep corrections of a wrong premise, needed context and your statements of uncertainty."
"SKILL.md#2.2": "State the links between ideas, and when I hold a wrong belief, say what it is, that it is wrong and why, then the correct idea."
"SKILL.md#2.3": "Keep each limit, condition and exception next to the claim it qualifies, and move side details to the end."
"SKILL.md#2.4": "When rewriting, add no steps, facts, advice, options or sections the original doesn't have."
"SKILL.md#3.1": "Open with one or two sentences that state the main point, so a reader who stops there knows it."
"SKILL.md#3.2": "Give the answer first: a summary to understand, numbered steps to do something, and for a decision written for others, the recommendation with its main reason and drawback, recommending only if the original does."
"SKILL.md#3.3": "In long texts, use descriptive headings, numbered lists for steps and tables for comparisons."
"SKILL.md#3.4": "When the text compares things or describes how they relate, add a table or diagram next to the prose."
"SKILL.md#3.5": "Publish live text the reader can resize or have read aloud, not text in images."
"SKILL.md#3.6": "In longer texts, bold the few phrases that carry the key ideas, never whole sentences."
"SKILL.md#4.1": "Use common words where the meaning stays exact, explain a needed rare word next to its first use, and keep every condition and limit."
"SKILL.md#4.2": "State where evidence is weak and your own uncertainty in the first person, and link each claim to the file or page it comes from."
"SKILL.md#4.3": "Use one term for each concept throughout."
"SKILL.md#4.4": "Use the active voice when the actor matters, and the passive when the actor is unknown or irrelevant."
"SKILL.md#4.5": "When I must apply an idea to new cases, give at least two worked examples that differ on the surface."
"SKILL.md#4.6": "Keep a neutral tone, without hype or aggressive words."
"SKILL.md#4.7": "Write short full sentences with the main verb early, not fragments joined by middle dots."
"SKILL.md#4.8": "Replace idioms, metaphors and hints with literal statements, and say what you need me to do and by when."
"SKILL.md#4.9": "Use exact numbers, dates and names instead of words like soon or a few when the values are known."
"SKILL.md#4.10": "Use gender-neutral words, a person's own pronouns, and no ableist words."
"SKILL.md#5": "When rewriting, check that every number, name, condition, limit and recommendation is still there and means the same, and restore any that changed."
