Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 20
LogLevel Notice
# The proxy sits on the inner and the outer network and accepts any client address. That is safe because the
# sandbox is its only client: the outer network holds no other container and the inner one has no route out.
# Only HTTPS tunnels to allowlisted hosts pass.
Allow 0.0.0.0/0
ConnectPort 443
Filter "/etc/tinyproxy/allow.txt"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
