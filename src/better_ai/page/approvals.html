<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Page agent approvals</title>
  <link rel="stylesheet" href="/page.css">
  <link rel="stylesheet" href="/approvals.css">
  <script src="/approvals.js" defer></script>
</head>
<body>
  <main>
    <h1>Page agent approvals</h1>
    <p id="status" role="status">Connecting…</p>
    <a id="page" href="#page" target="_blank" rel="noopener noreferrer" hidden>Open the page</a>
    <button id="enroll" type="button" hidden>Set up approvals</button>
    <button id="stop" type="button" hidden>Stop agent</button>
    <button id="start" type="button" hidden>Start agent</button>
    <p id="notice"></p>
    <section id="requests" aria-label="Pending approvals"></section>
    <p id="outcome" role="status"></p>
    <p id="error" role="alert"></p>
  </main>
</body>
</html>
