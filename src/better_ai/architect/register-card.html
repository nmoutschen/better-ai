<article data-kind="$name">
  <div class="icon">
    <svg viewBox="-1 -1 16 16" width="56" height="56" aria-hidden="true">$icon</svg>
  </div>
  <div>
    <h3>$label</h3>
    <p><code>$name</code></p>
    <p>$use</p>
    <div class="box">
      <svg viewBox="-1 -1 16 16" width="15" height="15" aria-hidden="true">$icon</svg>
      <span>$label</span>
    </div>
  </div>
</article>
